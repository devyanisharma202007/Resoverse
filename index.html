<script>
/* ════════════════════════════════════════════════════════════════
   THE ONLINE LAYER

   Two people on two phones, one society.

   There are no accounts here. A browser gets a device id the first
   time it opens the page, and that id is what claims a character,
   holds a seat at the Ludo table and signs a message in chat. It is
   enough to stop two people being David at once, and it asks nobody
   to sign up for anything.

   Everything below is optional. If the shared layer is unavailable —
   the page opened as a plain file, the viewer said no, the network
   is down — every call returns nothing and the campus runs exactly
   as it did offline. That is deliberate: a society Wi-Fi is not a
   dependency you get to have.
   ════════════════════════════════════════════════════════════════ */

let DB = null, ROOM = null;
let online = { db: false, room: false, kind: 'none', peers: [], claims: {}, notes: [] };
const note = (t) => { online.notes.push(t); if (online.notes.length > 8) online.notes.shift(); };

const deviceId = (() => {
  try {
    let d = localStorage.getItem('resoverse:device');
    if (!d) {
      d = 'd' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
      localStorage.setItem('resoverse:device', d);
    }
    return d;
  } catch { return 'd' + Math.random().toString(36).slice(2, 12); }
})();

let liveMembers = new Set();   // characters somebody else is playing right now

const CLAIM_STALE_MS = 1000 * 60 * 60 * 24 * 14;   // a fortnight away and the seat frees up
const claimOf = id => online.claims[id];
const claimedByMe = id => { const c = claimOf(id); return !!c && c.device === deviceId; };
/* Who is actually unavailable.
 *
 * A claim is a record that some browser once picked this member. It is NOT
 * proof that anybody is playing them now — and treating it as proof locked
 * the whole society out: three characters claimed from three of Devyani's
 * own devices, and the fourth person to open the link found every tile
 * greyed out with no way in.
 *
 * So only somebody who is on the campus RIGHT NOW holds a character. A claim
 * with nobody behind it is a soft hold: the picker shows who had it and lets
 * the next person take it. */
const heldLive = id => liveMembers.has(id) && id !== state.playerId;
const heldStale = id => {
  if (heldLive(id)) return false;
  const c = claimOf(id);
  return !!c && c.device !== deviceId && Date.now() - (c.at || 0) < CLAIM_STALE_MS;
};
const claimedByOther = id => heldLive(id);

/* ── connect ─────────────────────────────────────────────────────
   Nothing here blocks the page. The world is already running by the
   time any of this resolves, and every branch has to cope with never
   resolving at all.
   ────────────────────────────────────────────────────────────── */

async function goOnline() {
  const back = await connectBackend();
  online.kind = back.kind;

  DB = back.db;
  if (DB) {
    online.db = true;
    watchClaims();
    watchSharedRoster();
    watchSharedEvents();
    watchScores();
    heartbeat();
  }

  ROOM = back.room;
  if (ROOM) {
    online.room = true;
    ROOM.onPeers(change => {
      /* Two tabs of the same browser share a device id, so both can hold the
         same claim honestly and then each render the other as a second Juman.
         One entry per character, newest wins, and never your own. */
      const byMember = new Map();
      change.peers.forEach(pr => {
        if (pr.isMe || !pr.presence || !pr.presence.member) return;
        if (pr.presence.member === state.playerId) return;
        const cur = byMember.get(pr.presence.member);
        if (!cur || (pr.updatedAt || 0) > (cur.updatedAt || 0)) byMember.set(pr.presence.member, pr);
      });
      online.peers = [...byMember.values()];
      liveMembers = new Set(online.peers.map(pr => pr.presence.member));
      paintOnline();
    });
    ROOM.on('say', msg => {
      if (msg.isMe || !msg.data) return;
      const who = String(msg.data.who || 'someone').slice(0, 24);
      const text = String(msg.data.text || '').slice(0, 120);
      if (!text || !world) return;
      world.chat.push({ who, text, tint: '#4ade80', at: world.t, live: true });
      sfx.chatIn();
      if (world.chat.length > 80) world.chat.shift();
      paintChat(true);
    });
    ROOM.onConnection(() => paintOnline());
    pushPresence();
    setInterval(pushPresence, 900);
  }
  paintOnline();
  if (online.db || online.room) refreshMe();
}

/* ── who is who ─────────────────────────────────────────────── */

function watchClaims() {
  DB.collection('claims').onSnapshot(snap => {
    const next = {};
    snap.docs.forEach(d => { const v = d.data() || {}; next[d.id] = v; });
    online.claims = next;
    paintOnline();
  }, () => { /* a dropped watch is not an error worth showing anybody */ });
}

async function claimCharacter(memberId) {
  // only a person actually on the campus can block you
  if (heldLive(memberId)) return { ok: false, by: 'somebody already on the campus' };
  if (!DB) return { ok: true, local: true };
  try {
    // release whatever else this device was holding
    Object.entries(online.claims).forEach(([id, c]) => {
      if (id !== memberId && c && c.device === deviceId) DB.doc('claims/' + id).delete().catch(() => {});
    });
    const m = MEMBERS.find(x => x.id === memberId);
    await DB.doc('claims/' + memberId).set({
      device: deviceId, name: (m && m.name) || memberId, at: Date.now(),
    });
    return { ok: true };
  } catch { return { ok: true, local: true }; }
}

async function releaseCharacter() {
  if (!DB || !state.playerId) return;
  if (!claimedByMe(state.playerId)) return;
  try { await DB.doc('claims/' + state.playerId).delete(); } catch { /* it stays claimed; harmless */ }
}

function heartbeat() {
  const beat = () => {
    if (!DB || !state.playerId || !claimedByMe(state.playerId)) return;
    DB.doc('claims/' + state.playerId).update({ at: Date.now() }).catch(() => {});
  };
  setInterval(beat, 1000 * 60 * 5);
}

/* ── one society, shared ────────────────────────────────────── */

function watchSharedRoster() {
  DB.collection('roster').onSnapshot(snap => {
    const shared = snap.docs.map(d => Object.assign({}, d.data(), { id: d.id }));
    const mine = (state.custom || []).filter(m => !shared.some(s => s.id === m.id));
    state.custom = shared.concat(mine);
    rebuildRoster();
    if (world) refreshMe();
  }, () => {});
}

async function pushMemberShared(member) {
  if (!DB) return;
  try { await DB.doc('roster/' + member.id).set(JSON.parse(JSON.stringify(member))); } catch {}
}
async function removeMemberShared(id) {
  if (!DB) return;
  try { await DB.doc('roster/' + id).delete(); } catch {}
}

function watchSharedEvents() {
  DB.collection('events').onSnapshot(snap => {
    const shared = snap.docs.map(d => Object.assign({}, d.data(), { id: d.id }));
    if (shared.length) sharedEvents = shared;
    else sharedEvents = null;
    if (ui && ui.rebuildEvents) ui.rebuildEvents();
  }, () => {});
}

/* ── the one leaderboard, now genuinely one ─────────────────── */

let sharedScores = null;

function watchScores() {
  DB.collection('scores').onSnapshot(snap => {
    sharedScores = snap.docs.map(d => d.data() || {});
    paintOnline();
  }, () => {});
}

async function pushScore(board, memberId, score, level) {
  if (!DB) return;
  const key = board + '__' + memberId;
  try {
    const cur = await DB.doc('scores/' + key).get();
    const prev = cur.exists ? (cur.data() || {}) : null;
    if (prev && (prev.score || 0) >= score) return;
    await DB.doc('scores/' + key).set({
      board, memberId, score, level,
      name: (MEMBERS.find(m => m.id === memberId) || {}).name || memberId,
      device: deviceId, at: Date.now(),
    });
  } catch { /* the local board still has it */ }
}

async function pushXp() {
  if (!DB || !state.playerId) return;
  const p = levelOf(myXp());
  pushScore('xp', state.playerId, myXp(), p.level);
}

/* ── live presence ──────────────────────────────────────────── */

function pushPresence() {
  if (!ROOM || !world) return;
  const p = world.player;
  ROOM.presence({
    member: state.playerId, name: meMember().name,
    area: world.areaId, x: Math.round(p.x * 10) / 10, y: Math.round(p.y * 10) / 10,
    facing: p.facing, pose: p.pose, level: levelOf(myXp()).level,
    title: (typeof myTitle === 'function' && myTitle()) || '',
    device: deviceId,
  }).catch(() => {});
}

function sayOnline(text) {
  if (!ROOM) return;
  ROOM.emit('say', { who: meMember().name, text, member: state.playerId }).catch(() => {});
}

/* Peers standing in the same room as you, as real people on the floor. */
function peerActors() {
  if (!world) return [];
  return online.peers
    .filter(pr => pr.presence.area === world.areaId && pr.presence.member !== state.playerId)
    .map(pr => {
      const m = MEMBERS.find(x => x.id === pr.presence.member);
      return {
        id: 'peer:' + pr.peer, characterId: pr.presence.member,
        name: String(pr.presence.name || 'someone').slice(0, 18),
        look: m ? m.appearance : extraLook(pr.peer.length + 3),
        instrument: m ? ROLE_INSTRUMENT[m.role] : 'none',
        x: pr.presence.x, y: pr.presence.y,
        facing: ['N', 'E', 'S', 'W'].includes(pr.presence.facing) ? pr.presence.facing : 'S',
        pose: FRAMES[pr.presence.pose] ? pr.presence.pose : 'idle',
        clock: performance.now() / 1000, say: null, live: true,
      };
    });
}

/* ── the online chip in the HUD ─────────────────────────────── */

/* What the connection is actually doing.
 *
 * "Offline" with no explanation is the worst thing this panel can say. Half a
 * connection is a real state — the table can be readable while the live
 * channel is refused — and the reason is almost always one of three things,
 * so the panel says which. */
function connectionReport() {
  const box = el('div');
  box.style.cssText = 'margin-top:12px;padding:12px 14px;border-radius:12px;'
    + 'background:rgba(139,92,246,.08);border:1px solid rgba(139,92,246,.2)';
  box.dataset.rv = 'conn-report';
  const line = (label, good, detail) => {
    const r = el('div');
    r.style.cssText = 'display:flex;align-items:center;gap:9px;font-size:12.5px;padding:3px 0';
    const dot = el('span', 'livedot' + (good ? ' on' : ''));
    if (!good) dot.style.background = '#fb7185';
    r.append(dot, el('b', '', label));
    r.querySelector('b').style.fontWeight = '600';
    if (detail) { const d = el('span', '', detail);
      d.style.cssText = 'color:var(--faint);margin-left:auto;font-size:11.5px';
      r.appendChild(d); }
    return r;
  };
  box.appendChild(el('div', 'eyebrow', 'Connection'));
  box.appendChild(line('Shared database', online.db,
    online.db ? 'connected' : 'not connected'));
  const liveOk = online.room && ROOM && ROOM.connected && ROOM.connected();
  box.appendChild(line('Live channel', liveOk, liveOk ? 'connected' : 'not connected'));
  if (ROOM && ROOM.stats) { const st = ROOM.stats();
    box.appendChild(line('Messages', st.got > 0 || st.sent > 0,
      st.sent + ' sent, ' + st.got + ' received')); }
  box.appendChild(line('People here now', online.peers.length > 0,
    online.peers.length ? online.peers.length + ' besides you' : 'nobody else right now'));
  if (online.notes.length) {
    const log = el('div');
    log.style.cssText = 'margin-top:9px;font-family:var(--mono);font-size:10.5px;'
      + 'line-height:1.7;color:var(--faint);word-break:break-word';
    online.notes.forEach(n => log.appendChild(el('div', '', n)));
    box.appendChild(log);
  }
  return box;
}

function paintOnline() {
  // somebody claimed a character while the picker was open — redraw it, or
  // the next person will be offered a seat that has just gone
  if (typeof pickerOpen !== 'undefined' && pickerOpen
      && document.querySelector('[data-rv="picker"]')) pickCharacter();
  if (!ui || !ui.online) return;
  const n = online.peers.length;
  const live = online.room && ROOM && ROOM.connected && ROOM.connected();
  ui.online.style.display = (online.db || online.room) ? 'flex' : 'none';
  ui.onlineDot.className = 'livedot' + (live ? ' on' : '');
  ui.onlineTxt.textContent = !live ? 'Offline'
    : n === 0 ? 'You are the only one here'
    : n === 1 ? '1 other person online'
    : n + ' others online';
}

PANELS.online = function (sheet) {
  sheet.appendChild(el('div', 'eyebrow', 'Right now'));
  sheet.appendChild(el('h2', '', 'Who is on the campus'));

  if (!online.room && !online.db) {
    sheet.appendChild(connectionReport());
    sheet.appendChild(el('p', 'body', 'This copy is running on its own. Everything works — '
      + 'the campus, the games, the instruments, your XP — but nobody else is connected '
      + 'to it, so you are the only person on the square.'));
    sheet.appendChild(el('p', 'foot', 'To play together you need a copy with a shared world '
      + 'behind it: the link shared from Claude, or a copy of the page with a Supabase '
      + 'project set in RV_CONFIG. The README explains both.'));
    return;
  }
  sheet.appendChild(el('p', 'foot', online.kind === 'supabase'
    ? 'Shared through this society’s own Supabase project.'
    : 'Shared through Claude.'));
  sheet.appendChild(connectionReport());

  const me = meMember();
  const rows = el('div', 'rows');
  const mine = rowNode(null, gearedLook(me), me.name + '  (you)',
    'Level ' + levelOf(myXp()).level + ' · ' + (world ? world.area.name : ''), null);
  mine.style.background = 'rgba(251,191,36,.13)';
  rows.appendChild(mine);

  online.peers.forEach(pr => {
    const m = MEMBERS.find(x => x.id === pr.presence.member);
    const area = getArea(pr.presence.area);
    const r = rowNode(null, m ? m.appearance : null, String(pr.presence.name || 'someone'),
      'Level ' + (pr.presence.level || 1) + ' · ' + area.name, null);
    const d = el('span', 'livedot on');
    r.appendChild(d);
    rows.appendChild(r);
  });
  sheet.appendChild(rows);

  if (!online.peers.length) {
    sheet.appendChild(el('p', 'foot', 'Nobody else has it open. Send the link round — '
      + 'you will see each other walking about, and you can share a Ludo table.'));
  }

  sheet.appendChild(el('div', 'eyebrow', 'Characters')).style.margin = '20px 0 8px';
  sheet.appendChild(el('p', 'body', 'One person to a character. Whoever claims a member holds '
    + 'them until they let go, so two people can never both be Juman.'));
  const cl = el('div', 'rows'); cl.style.marginTop = '10px';
  MEMBERS.forEach(m => {
    const c = claimOf(m.id);
    const r = rowNode(null, m.appearance, m.name,
      claimedByMe(m.id) ? 'Yours' : heldLive(m.id) ? 'On the campus now'
        : c ? 'Last used on another device' : 'Free', null);
    if (claimedByMe(m.id)) r.appendChild(el('span', 'chip on', 'You'));
    else if (heldLive(m.id)) { r.style.opacity = '.55'; r.appendChild(el('span', 'chip', 'Playing now')); }
    else r.appendChild(el('span', 'chip on', 'Free'));
    cl.appendChild(r);
  });
  sheet.appendChild(cl);

  const freeAll = el('button', 'btn ghost', 'Free every character');
  freeAll.dataset.rv = 'free-all';
  freeAll.style.cssText = 'margin-top:14px;margin-right:8px';
  freeAll.onclick = async () => {
    if (freeAll.dataset.armed !== '1') { freeAll.dataset.armed = '1';
      freeAll.textContent = 'Tap again — this clears everyone'; return; }
    if (!DB) return;
    await Promise.all(Object.keys(online.claims)
      .map(id => DB.doc('claims/' + id).delete().catch(() => {})));
    toast('Every character is free again');
    openPanel('online');
  };
  sheet.appendChild(freeAll);

  if (claimedByMe(state.playerId)) {
    const rel = el('button', 'btn ghost', 'Let go of ' + me.name);
    rel.style.marginTop = '14px';
    rel.onclick = async () => { await releaseCharacter(); toast(me.name + ' is free again'); openPanel('online'); };
    sheet.appendChild(rel);
  }
};
</script>
<script>
/* ════════════════════════════════════════════════════════════════
   THE EVENT BOARD, EDITABLE

   The society's calendar changes every fortnight. Having it live in
   the source of the page meant it went stale the day after it was
   written, which is the same as not having one.
   ════════════════════════════════════════════════════════════════ */

const EVENT_COLORS = ['#ec4899', '#fbbf24', '#22d3ee', '#8b5cf6', '#5eead4', '#f472b6'];
const VENUES = ['The Stage', 'Lounge', 'Resonance HQ', 'Music Room', 'The Arcade', 'Campus'];

const eventSlug = (title, taken) => {
  const base = (title || 'event').toLowerCase().replace(/[^a-z0-9]+/g, '-')
    .replace(/^-|-$/g, '').slice(0, 24) || 'event';
  let id = base, n = 2;
  while (taken.has(id)) id = base + '-' + (n++);
  taken.add(id);
  return id;
};

/* The working copy: whatever the shared board says, or the local one, or
   the list this page shipped with. Editing always writes a local copy so
   the board still works with nobody else connected. */
function editableEvents() {
  if (sharedEvents && sharedEvents.length) return sharedEvents.slice();
  if (state.events && state.events.length) return state.events.slice();
  return EVENTS.slice();
}

async function saveEvent(ev) {
  const list = editableEvents();
  const i = list.findIndex(e => e.id === ev.id);
  if (i >= 0) list[i] = ev; else list.push(ev);
  state.events = list;
  save();
  if (typeof DB !== 'undefined' && DB) {
    try { await DB.doc('events/' + ev.id).set(JSON.parse(JSON.stringify(ev))); } catch {}
  }
  if (ui.rebuildEvents) ui.rebuildEvents();
}

async function deleteEvent(id) {
  state.events = editableEvents().filter(e => e.id !== id);
  save();
  if (typeof DB !== 'undefined' && DB) { try { await DB.doc('events/' + id).delete(); } catch {} }
  if (ui.rebuildEvents) ui.rebuildEvents();
}

/* <input type="datetime-local"> wants exactly this, and gives back exactly
   this, so the stored string is the same string all the way through. */
const toLocalInput = when => {
  const d = new Date(when);
  if (isNaN(d)) return '';
  const pad = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate())
    + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes());
};

PANELS.eventedit = function (sheet, editId) {
  const list = editableEvents();
  const taken = new Set(list.map(e => e.id));

  if (editId === undefined) {
    sheet.appendChild(el('div', 'eyebrow', "What's on"));
    sheet.appendChild(el('h2', '', 'Edit the board'));
    sheet.appendChild(el('p', 'body', 'Change these and the board changes for everyone with the '
      + 'page open — the rail on the right, the notice board, the Stage.'));

    const rows = el('div', 'rows'); rows.style.margin = '16px 0';
    upcoming().forEach(e => {
      const r = rowNode(null, null, e.title, whenLabel(e) + ' · ' + e.venue, null);
      r.style.borderLeft = '3px solid ' + e.color;
      r.style.cursor = 'pointer';
      const b = el('button', 'chip on', 'Edit');
      b.dataset.rv = 'event-edit-' + e.id;
      r.appendChild(b);
      r.onclick = () => openPanel('eventedit', e.id);
      rows.appendChild(r);
    });
    sheet.appendChild(rows);

    const add = el('button', 'btn', '+  Put something on the board');
    add.dataset.rv = 'event-add';
    add.style.width = '100%';
    add.onclick = () => openPanel('eventedit', null);
    sheet.appendChild(add);
    sheet.appendChild(el('p', 'foot', 'Dates use this device’s clock, so everybody sees the '
      + 'same moment in their own time.'));
    return;
  }

  const existing = editId ? list.find(e => e.id === editId) : null;
  const draft = existing ? JSON.parse(JSON.stringify(existing)) : {
    id: null, title: '', when: toLocalInput(Date.now() + 86400000 * 7),
    venue: 'The Stage', color: EVENT_COLORS[0], performers: [], text: '',
  };
  draft.when = toLocalInput(draft.when) || draft.when;

  sheet.querySelector('h2') || sheet.appendChild(el('div', 'eyebrow', 'Event'));
  sheet.appendChild(el('h2', '', existing ? 'Edit event' : 'New event'));

  const form = el('div', 'form');
  sheet.appendChild(form);

  const field = (label, node) => { const f = el('div', 'field'); f.append(el('span', '', label), node); return f; };
  const inp = (val, on, ph, type, max) => {
    const i = el('input'); i.type = type || 'text'; i.value = val || ''; i.placeholder = ph || '';
    if (max) i.maxLength = max;
    i.oninput = () => on(i.value);
    i.onkeydown = e => e.stopPropagation();
    return i;
  };

  form.appendChild(field('Title', inp(draft.title, v => draft.title = v, "Freshers' Night '26", 'text', 48)));
  const g = el('div', 'two');
  g.append(field('When', inp(draft.when, v => draft.when = v, '', 'datetime-local')),
    (() => { const sel = el('select');
      VENUES.forEach(v => { const o = el('option', '', v); o.value = v; sel.appendChild(o); });
      if (!VENUES.includes(draft.venue)) { const o = el('option', '', draft.venue); o.value = draft.venue; sel.appendChild(o); }
      sel.value = draft.venue; sel.onchange = () => draft.venue = sel.value;
      return field('Where', sel); })());
  form.appendChild(g);

  const cols = el('div', 'swatches');
  EVENT_COLORS.forEach(c => {
    const b = el('button', 'sw' + (c === draft.color ? ' on' : ''));
    b.style.background = c;
    b.onclick = () => { [...cols.children].forEach(x => x.classList.remove('on')); b.classList.add('on'); draft.color = c; };
    cols.appendChild(b);
  });
  form.appendChild(field('Colour', cols));

  const ta = el('textarea'); ta.value = draft.text || ''; ta.maxLength = 300;
  ta.placeholder = 'What is happening, in a sentence or two.';
  ta.oninput = () => draft.text = ta.value;
  ta.onkeydown = e => e.stopPropagation();
  form.appendChild(field('Details', ta));

  const who = el('div', 'chips');
  MEMBERS.forEach(m => {
    const on = () => (draft.performers || []).includes(m.id);
    const c = el('button', 'chip' + (on() ? ' on' : ''), m.name);
    c.onclick = () => {
      draft.performers = draft.performers || [];
      const i = draft.performers.indexOf(m.id);
      if (i >= 0) draft.performers.splice(i, 1); else draft.performers.push(m.id);
      c.className = 'chip' + (on() ? ' on' : '');
    };
    who.appendChild(c);
  });
  form.appendChild(field('Who is playing', who));

  const btns = el('div'); btns.style.cssText = 'display:flex;gap:8px;flex-wrap:wrap;margin-top:4px';
  const ok = el('button', 'btn', existing ? 'Save' : 'Add to the board');
  ok.dataset.rv = 'event-save'; ok.style.flex = '1';
  ok.onclick = async () => {
    if (!draft.title.trim()) { toast('It needs a title'); return; }
    if (!draft.when) { toast('It needs a date'); return; }
    draft.title = draft.title.trim();
    if (!draft.id) draft.id = eventSlug(draft.title, taken);
    await saveEvent(draft);
    closePanel();
    toast(draft.title + ' is on the board');
    sfx.joined();
  };
  btns.appendChild(ok);

  const cancel = el('button', 'btn ghost', 'Cancel');
  cancel.onclick = () => openPanel('eventedit');
  btns.appendChild(cancel);

  if (existing) {
    const del = el('button', 'btn ghost', 'Take it down');
    del.style.color = '#fb7185';
    del.onclick = async () => {
      if (del.dataset.armed !== '1') { del.dataset.armed = '1'; del.textContent = 'Tap again to remove'; return; }
      await deleteEvent(existing.id);
      openPanel('eventedit');
    };
    btns.appendChild(del);
  }
  form.appendChild(btns);
};
</script>
<script>
/* ════════════════════════════════════════════════════════════════
   THE ONLINE TABLE

   Reso Ludo across devices. David on his phone, Juman on a laptop,
   the same board.

   The trick is that Ludo is turn-based, so there is no need for a
   referee: exactly one player may write at any moment — the one whose
   turn it is — and everybody else watches. Last-writer-wins is not a
   hazard when there is only ever one writer. The rules already live in
   pure functions, so the same `legalMoves` that decides a pass-and-play
   move decides an online one.
   ════════════════════════════════════════════════════════════════ */

const TABLE = 'tables/ludo';
const SEAT_LIMIT = 4;
const TABLE_IDLE_MS = 1000 * 60 * 25;      // a table nobody touched for 25 minutes is over

let tableUnsub = null;

const freshTable = () => ({
  phase: 'lobby', seats: [], pieces: [], turn: 0, die: null, sixes: 0,
  caps: [0, 0, 0, 0], standings: [], quad: [0, 1, 2, 3],
  host: deviceId, at: Date.now(), log: [],
});

const mySeat = t => (t.seats || []).findIndex(s => s.device === deviceId);
const myTurnAt = t => t.phase === 'playing' && mySeat(t) === t.turn;

async function writeTable(t) {
  if (!DB) return;
  t.at = Date.now();
  try { await DB.doc(TABLE).set(JSON.parse(JSON.stringify(t))); } catch { /* watchers will resync */ }
}

/* ── the online table screen ────────────────────────────────── */

function openOnlineLudo(onExit) {
  const host = document.createElement('div'); host.className = 'gamewrap'; host.dataset.rv = 'game';
  document.getElementById('overlay').appendChild(host);
  const close = () => {
    if (tableUnsub) { tableUnsub(); tableUnsub = null; }
    leaveTable();
    host.remove(); onExit && onExit();
  };

  let T = null;

  if (!DB) {
    host.appendChild(topBar('RESO LUDO · ONLINE', close));
    const body = el('div', 'gbody'); host.appendChild(body);
    const w = el('div'); w.style.maxWidth = '460px'; body.appendChild(w);
    w.appendChild(el('h2', '', 'Nobody to play with yet'));
    w.appendChild(el('p', 'body', 'This copy of the campus is running on its own, so there is no '
      + 'shared table to sit at. Open the link Claude shared and the online table appears — '
      + 'until then, pass-and-play works exactly the same on one device.'));
    const b = el('button', 'btn', 'Pass-and-play instead');
    b.style.marginTop = '16px';
    b.onclick = () => { host.remove(); openResoLudo(onExit); };
    w.appendChild(b);
    return;
  }

  tableUnsub = DB.doc(TABLE).onSnapshot(snap => {
    const data = snap.exists ? snap.data() : null;
    T = (!data || Date.now() - (data.at || 0) > TABLE_IDLE_MS) ? freshTable() : data;
    render();
  }, () => {
    host.innerHTML = '';
    host.appendChild(topBar('RESO LUDO · ONLINE', close));
    const body = el('div', 'gbody'); host.appendChild(body);
    body.appendChild(el('p', 'body', 'Lost the table. Check the connection and open it again.'));
  });

  async function leaveTable() {
    if (!T || !DB) return;
    const i = mySeat(T);
    if (i < 0) return;
    const t = JSON.parse(JSON.stringify(T));
    if (t.phase === 'lobby') {
      t.seats.splice(i, 1);
      t.seats.forEach((s, n) => s.id = n);
      t.pieces = [];
      if (!t.seats.length) { try { await DB.doc(TABLE).delete(); } catch {} return; }
      if (t.host === deviceId) t.host = t.seats[0].device;
    } else {
      // mid-match: the chair stays, the house takes over
      t.seats[i].kind = 'bot';
      t.seats[i].device = null;
      t.log = (t.log || []).concat(t.seats[i].name + ' left — the house plays that seat.');
    }
    await writeTable(t);
  }

  async function sit() {
    const t = T ? JSON.parse(JSON.stringify(T)) : freshTable();
    if (t.phase !== 'lobby') { toast('That match has already started'); return; }
    if (mySeat(t) >= 0) return;
    if (t.seats.length >= SEAT_LIMIT) { toast('The table is full'); return; }
    const me = meMember();
    if (t.seats.some(s => s.memberId === me.id)) { toast('Somebody is already playing as ' + me.name); return; }
    t.seats.push({ id: t.seats.length, memberId: me.id, name: me.name,
      device: deviceId, kind: 'human', place: null, color: LCOLORS[t.seats.length] });
    if (!t.host || !t.seats.some(s => s.device === t.host)) t.host = deviceId;
    await writeTable(t);
    sfx.joined();
  }

  async function begin() {
    const t = JSON.parse(JSON.stringify(T));
    if (t.seats.length < 2) { toast('Two players at least'); return; }
    t.quad = QUADS[t.seats.length] || [0, 1, 2, 3];
    t.seats.forEach((s, i) => { s.id = i; s.color = LCOLORS[i]; s.place = null; });
    t.pieces = [];
    t.seats.forEach((s, i) => { for (let n = 0; n < 4; n++)
      t.pieces.push({ id: 'p' + i + '-' + n, seat: i, state: 'yard', prog: -1, slot: n }); });
    t.phase = 'playing'; t.turn = 0; t.die = null; t.sixes = 0;
    t.caps = [0, 0, 0, 0]; t.standings = [];
    t.log = ['The table is set. ' + t.seats[0].name + ' to roll.'];
    await writeTable(t);
    sfx.win();
  }

  /* The rules run on whichever device owns the turn. QUAD is the module-level
     board mapping the pure rule functions read, so it is set from the table
     before any of them are called. */
  function withTable(t, fn) { const keep = QUAD; QUAD = t.quad || [0, 1, 2, 3];
    try { return fn(); } finally { QUAD = keep; } }

  async function roll() {
    if (!myTurnAt(T)) return;
    const t = JSON.parse(JSON.stringify(T));
    const die = 1 + Math.floor(Math.random() * 6);
    t.die = die;
    t.sixes = die === 6 ? (t.sixes || 0) + 1 : 0;
    const who = t.seats[t.turn].name;
    if (t.sixes >= 3) {
      t.log = (t.log || []).concat(who + ' rolls a third six — turn lost.');
      await writeTable(t); sfx.deny();
      setTimeout(() => pass(t), 700);
      return;
    }
    const moves = withTable(t, () => legalMoves(t, die));
    t.moves = moves;
    t.log = (t.log || []).concat(who + ' rolls ' + die + (moves.length ? '.' : ' — nothing to move.'));
    await writeTable(t);
    sfx.dice();
    if (!moves.length) setTimeout(() => pass(t), 900);
  }

  async function playPiece(pieceId) {
    if (!myTurnAt(T)) return;
    const t = JSON.parse(JSON.stringify(T));
    const m = (t.moves || []).find(x => x.id === pieceId);
    if (!m) return;
    const p = t.pieces.find(x => x.id === pieceId);
    if (m.enters) { p.state = 'track'; p.prog = 0; }
    else { p.prog = m.to; if (m.finishes) p.state = 'home'; }
    (m.caps || []).forEach(cid => { const c = t.pieces.find(x => x.id === cid);
      if (c) { c.state = 'yard'; c.prog = -1; } });
    t.caps[t.turn] = (t.caps[t.turn] || 0) + (m.caps || []).length;
    const who = t.seats[t.turn].name;
    t.log = (t.log || []).concat(
      (m.caps || []).length ? who + ' captures.' :
      m.finishes ? who + ' gets one home.' :
      m.enters ? who + ' brings a piece out.' : who + ' moves ' + t.die + '.');
    if ((m.caps || []).length) sfx.capture();
    else if (m.finishes) sfx.home();
    else sfx.piece();

    if (t.pieces.filter(x => x.seat === t.turn).every(x => x.state === 'home')) {
      t.seats[t.turn].place = (t.standings || []).length + 1;
      t.standings = (t.standings || []).concat(t.turn);
      t.log = t.log.concat(who + ' is home in ' + ord(t.seats[t.turn].place) + '.');
      fanfare();
    }
    const left = t.seats.filter(sx => sx.place === null).length;
    if (left <= 1) {
      t.seats.forEach(sx => { if (sx.place === null) sx.place = (t.standings || []).length + 1; });
      t.phase = 'over';
      await writeTable(t);
      settle(t);
      return;
    }
    t.moves = [];
    if ((m.caps || []).length || m.finishes || t.die === 6) { t.die = null; await writeTable(t); }
    else await pass(t);
  }

  async function pass(t0) {
    const t = JSON.parse(JSON.stringify(t0 || T));
    if (t.phase !== 'playing') return;
    let n = t.turn;
    for (let i = 1; i <= t.seats.length; i++) {
      const c = (t.turn + i) % t.seats.length;
      if (t.seats[c].place === null) { n = c; break; }
    }
    t.turn = n; t.die = null; t.sixes = 0; t.moves = [];
    await writeTable(t);
  }

  /* A seat with nobody behind it still has to take its turn, or the table
     stops dead when somebody closes their laptop. The host plays it. */
  function driveBots() {
    if (!T || T.phase !== 'playing') return;
    if (T.host !== deviceId) return;
    const seat = T.seats[T.turn];
    if (!seat || seat.kind !== 'bot') return;
    if (T.die === null) { setTimeout(() => { if (T && T.seats[T.turn] === seat) botRoll(); }, 800); }
    else if ((T.moves || []).length) { setTimeout(() => { if (T && (T.moves || []).length) botMove(); }, 700); }
  }
  async function botRoll() {
    const t = JSON.parse(JSON.stringify(T));
    const die = 1 + Math.floor(Math.random() * 6);
    t.die = die; t.sixes = die === 6 ? (t.sixes || 0) + 1 : 0;
    if (t.sixes >= 3) { await writeTable(t); return pass(t); }
    t.moves = withTable(t, () => legalMoves(t, die));
    t.log = (t.log || []).concat(t.seats[t.turn].name + ' rolls ' + die + '.');
    await writeTable(t);
    if (!t.moves.length) setTimeout(() => pass(t), 700);
  }
  async function botMove() {
    const t = JSON.parse(JSON.stringify(T));
    const moves = t.moves || [];
    const pick = moves.slice().sort((a, b) =>
      (b.caps.length * 100 + (b.finishes ? 80 : 0) + b.to) -
      (a.caps.length * 100 + (a.finishes ? 80 : 0) + a.to))[0];
    if (!pick) return pass(t);
    // reuse the human path so the rules can never diverge between the two
    T = t; await playPiece(pick.id);
  }

  function settle(t) {
    const me = mySeat(t);
    if (me < 0) return;
    const home = t.pieces.filter(p => p.seat === me && p.state === 'home').length;
    const dist = t.pieces.filter(p => p.seat === me).reduce((n, p) => n + Math.max(0, p.prog), 0);
    const score = home * 500 + dist * 6 + (t.caps[me] || 0) * 120
      + ([0, 1200, 700, 350, 150][t.seats[me].place] || 0);
    submitScore('ludo', state.playerId, score, home);
    grantXp(Math.round(score / 90) + (t.seats[me].place === 1 ? 45 : 0));
  }

  /* ── drawing ── */
  function render() {
    if (!T) return;
    const seat = mySeat(T);
    host.innerHTML = '';
    host.appendChild(topBar('RESO LUDO · ONLINE', close,
      T.phase === 'over' ? async () => { await DB.doc(TABLE).delete().catch(() => {}); } : null,
      T.phase === 'over' ? 'Clear the table' : ''));
    const body = el('div', 'gbody'); host.appendChild(body);

    if (T.phase === 'lobby') {
      const w = el('div'); w.style.maxWidth = '460px'; body.appendChild(w);
      w.appendChild(el('h2', '', 'The table'));
      w.appendChild(el('p', 'body', 'Everyone with the page open can sit down. Take a seat, and '
        + 'whoever set the table starts it when you are ready. You play as your own character.'));

      const rows = el('div', 'rows'); rows.style.margin = '16px 0';
      for (let i = 0; i < SEAT_LIMIT; i++) {
        const s = T.seats[i];
        const m = s && MEMBERS.find(x => x.id === s.memberId);
        const r = el('div', 'row');
        r.style.borderLeft = '3px solid ' + LCOLORS[i];
        const face = el('span', 'face');
        if (m) face.appendChild(portrait(m.appearance, 30));
        const mid = el('span'); mid.style.flex = '1';
        mid.append(el('b', '', s ? s.name : 'Empty chair'),
          el('em', '', s ? (s.device === deviceId ? 'You' : 'Sitting down')
            : 'Anybody can take this one'));
        r.append(el('span', 'rank', String(i + 1)), face, mid);
        if (s && s.device === T.host) r.appendChild(el('span', 'chip on', 'Set the table'));
        rows.appendChild(r);
      }
      w.appendChild(rows);

      const btns = el('div'); btns.style.cssText = 'display:flex;gap:8px;flex-wrap:wrap';
      if (seat < 0) {
        const b = el('button', 'btn', 'Take a seat as ' + meMember().name);
        b.dataset.rv = 'table-sit'; b.style.flex = '1'; b.onclick = sit;
        btns.appendChild(b);
      } else {
        const b = el('button', 'btn ghost', 'Stand up');
        b.onclick = async () => { await leaveTable(); };
        btns.appendChild(b);
        if (T.host === deviceId) {
          const g = el('button', 'btn', T.seats.length < 2 ? 'Waiting for one more' : 'Start the match');
          g.dataset.rv = 'table-start';
          g.style.flex = '1'; g.disabled = T.seats.length < 2;
          if (T.seats.length < 2) g.style.opacity = '.5';
          g.onclick = begin;
          btns.appendChild(g);
        } else {
          btns.appendChild(el('p', 'foot', 'Waiting for ' +
            ((T.seats.find(x => x.device === T.host) || {}).name || 'the host') + ' to start.'));
        }
      }
      w.appendChild(btns);

      const solo = el('button', 'btn ghost', 'Play on this device instead');
      solo.style.cssText = 'width:100%;margin-top:10px';
      solo.onclick = () => { if (tableUnsub) tableUnsub(); host.remove(); openResoLudo(onExit); };
      w.appendChild(solo);
      return;
    }

    /* ── the board, shared ── */
    const boardEl = el('div', 'ludo'); body.appendChild(boardEl);
    const side = el('div', 'stats'); side.style.minWidth = '210px'; body.appendChild(side);

    const pc = n => (n / 15 * 100) + '%';
    const quad = T.quad || [0, 1, 2, 3];
    const seatOfQuad = q => T.seats.find(s => quad[s.id] === q) || null;
    const sq = (x, y, bg, border) => { const d = el('div', 'lsq');
      d.style.cssText = 'left:' + pc(x + .08) + ';top:' + pc(y + .08) + ';width:' + pc(.84)
        + ';height:' + pc(.84) + ';background:' + bg + ';border:1px solid ' + border;
      boardEl.appendChild(d); };

    LTRACK.forEach(([x, y], i) => {
      const owner = LSTART.indexOf(i), st = owner >= 0 ? seatOfQuad(owner) : null;
      sq(x, y, st ? st.color + '99' : LSAFE.has(i) ? 'rgba(255,255,255,.14)' : 'rgba(255,255,255,.05)',
        'rgba(255,255,255,.09)');
    });
    [0, 1, 2, 3].forEach(q => {
      const st = seatOfQuad(q), col = st ? st.color : '#6e6690';
      LHOME[q].slice(0, 5).forEach(([x, y], i) =>
        sq(x, y, st ? col + (50 + i * 10).toString(16) : 'rgba(255,255,255,.05)',
          st ? col + '88' : 'rgba(255,255,255,.09)'));
      const b = el('div', 'lsq'), yb = LYARD[q];
      const minx = Math.min(...yb.map(c => c[0])) - 1.2, miny = Math.min(...yb.map(c => c[1])) - 1.2;
      b.style.cssText = 'left:' + pc(minx) + ';top:' + pc(miny) + ';width:' + pc(4.4)
        + ';height:' + pc(4.4) + ';background:' + col + (st ? '22' : '11')
        + ';border:1px solid ' + col + (st ? '66' : '2e') + ';border-radius:12px';
      boardEl.insertBefore(b, boardEl.firstChild);
    });

    const centre = el('div');
    centre.style.cssText = 'position:absolute;left:' + pc(6) + ';top:' + pc(6) + ';width:'
      + pc(3) + ';height:' + pc(3) + ';display:grid;place-items:center';
    [0, 1, 2, 3].forEach(q => { const st = seatOfQuad(q), wdg = el('div');
      wdg.style.cssText = 'position:absolute;inset:0;background:'
        + (st ? st.color + 'aa' : 'rgba(255,255,255,.06)') + ';clip-path:'
        + ['polygon(0 0,50% 50%,0 100%)', 'polygon(0 0,100% 0,50% 50%)',
           'polygon(100% 0,100% 100%,50% 50%)', 'polygon(0 100%,50% 50%,100% 100%)'][q];
      centre.appendChild(wdg); });
    const hubDot = el('div', '', 'RESO');
    hubDot.style.cssText = 'position:absolute;inset:32%;border-radius:50%;background:rgba(12,10,28,.92);'
      + 'border:1px solid rgba(255,255,255,.2);display:grid;place-items:center;font-family:var(--display);'
      + 'font-style:italic;font-weight:800;font-size:9px;letter-spacing:.06em';
    centre.appendChild(hubDot); boardEl.appendChild(centre);

    const canMove = new Set(myTurnAt(T) ? (T.moves || []).map(m => m.id) : []);
    const spots = {};
    T.pieces.forEach(p => {
      const c = withTable(T, () => p.state === 'yard' ? LYARD[quad[p.seat]][p.slot] : cellFor(p.seat, p.prog));
      const k = p.state === 'yard' ? 'y' + p.id : c[0] + ',' + c[1];
      (spots[k] = spots[k] || []).push({ p, c });
    });
    Object.values(spots).forEach(listx => listx.forEach((e, i) => {
      const off = listx.length > 1 ? (i - (listx.length - 1) / 2) * .22 : 0;
      const b = el('button', 'lpiece' + (canMove.has(e.p.id) ? ' can' : ''));
      b.dataset.rv = 'piece-' + e.p.id;
      b.style.cssText = 'width:' + pc(.66) + ';height:' + pc(.66)
        + ';background:' + LCOLORS[e.p.seat] + ';color:' + LCOLORS[e.p.seat]
        + ';left:' + pc(e.c[0] + .17 + off) + ';top:' + pc(e.c[1] + .17);
      if (canMove.has(e.p.id)) b.onclick = () => playPiece(e.p.id);
      boardEl.appendChild(b);
    }));

    /* ── the side ── */
    const seatRows = el('div', 'rows'); side.appendChild(seatRows);
    T.seats.forEach((s, i) => {
      const m = MEMBERS.find(x => x.id === s.memberId);
      const home = T.pieces.filter(p => p.seat === i && p.state === 'home').length;
      const r = el('div', 'row');
      r.style.border = i === T.turn ? '1px solid ' + s.color : '1px solid transparent';
      const f = el('span', 'face'); if (m) f.appendChild(portrait(m.appearance, 30));
      const mid = el('span'); mid.style.flex = '1';
      mid.append(el('b', '', s.name + (s.device === deviceId ? ' (you)' : '')),
        el('em', '', s.place ? ord(s.place) + ' — home' :
          s.kind === 'bot' ? 'House' : home + '/4 home'));
      r.append(f, mid);
      if (i === T.turn && T.phase === 'playing') r.appendChild(el('span', 'livedot on'));
      seatRows.appendChild(r);
    });

    if (T.phase === 'playing') {
      const dieBox = el('div', 'row'); dieBox.style.gap = '14px';
      const dieEl = el('div', 'die');
      if (T.die) {
        const dots = { 1: [[50, 50]], 2: [[28, 28], [72, 72]], 3: [[26, 26], [50, 50], [74, 74]],
          4: [[28, 28], [72, 28], [28, 72], [72, 72]],
          5: [[28, 28], [72, 28], [50, 50], [28, 72], [72, 72]],
          6: [[28, 24], [72, 24], [28, 50], [72, 50], [28, 76], [72, 76]] }[T.die] || [];
        dots.forEach(([dx, dy]) => { const d = el('i');
          d.style.cssText = 'left:' + dx + '%;top:' + dy + '%'; dieEl.appendChild(d); });
      }
      const txt = el('div'); txt.style.flex = '1';
      const active = T.seats[T.turn];
      txt.innerHTML = '<b>' + (myTurnAt(T) ? 'Your turn' : active.name + ' to play') + '</b>'
        + '<em>' + (T.die ? ((T.moves || []).length ? 'Pick a piece' : 'Nothing to move')
          : 'Rolling') + '</em>';
      dieBox.append(dieEl, txt); side.appendChild(dieBox);

      if (myTurnAt(T) && T.die === null) {
        const rb = el('button', 'btn', 'Roll');
        rb.dataset.rv = 'table-roll'; rb.onclick = roll; side.appendChild(rb);
      } else if (!myTurnAt(T)) {
        const wait = el('div', 'row');
        wait.append(el('span', 'livedot on'), el('em', '', 'Waiting for ' + active.name + '…'));
        side.appendChild(wait);
      }
    } else if (T.phase === 'over') {
      const table = T.seats.slice().sort((a, b) => (a.place || 9) - (b.place || 9));
      side.appendChild(el('h2', '', table[0].name + ' wins'));
      const rows2 = el('div', 'rows');
      table.forEach((s, i) => {
        const m = MEMBERS.find(x => x.id === s.memberId);
        rows2.appendChild(rowNode(i + 1, m ? m.appearance : null, s.name,
          ord(s.place || i + 1), null));
      });
      side.appendChild(rows2);
      const again = el('button', 'btn', 'Set another table');
      again.onclick = async () => { await DB.doc(TABLE).set(freshTable()); };
      side.appendChild(again);
    }

    const log = el('div', 'row');
    log.style.cssText = 'flex-direction:column;align-items:flex-start;gap:3px;max-height:140px;overflow:auto';
    (T.log || []).slice(-9).forEach(line => {
      const e = el('em', '', line); e.style.fontSize = '11.5px'; log.appendChild(e);
    });
    side.appendChild(log);

    driveBots();
  }
}
</script>
<style>
.slider{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:11px;background:rgba(139,92,246,.08)}
.slider input[type=range]{flex:1;accent-color:var(--violet);height:4px}
.slider b{font-size:13.5px;min-width:70px}
.slider em{font-family:var(--mono);font-size:11px;color:var(--faint);font-style:normal;min-width:34px;text-align:right}
</style>

<script>
/* ════════════════════════════════════════════════════════════════
   SOUND

   Every sound in Resoverse is made by an oscillator or a burst of
   generated noise at the moment it plays. There is not one audio
   file in this project, which is the only reason the society can put
   this online without asking anybody's permission for anything.

   Three layers:
   · one-shots  — a footstep, a door, a button, a coin
   · ambience   — a pad and a texture per area, crossfaded on travel
   · the world  — the fountain and the PA get louder as you walk at them

   All of it hangs off one master gain, so the slider in Settings is a
   real volume control and muting genuinely stops the graph.
   ════════════════════════════════════════════════════════════════ */

let AUD = null;

function sound() {
  if (!state.sound) return null;
  if (AUD) { if (AUD.ac.state === 'suspended') AUD.ac.resume(); return AUD; }
  let ac;
  try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch { return null; }

  const master = ac.createGain();
  master.gain.value = (state.volume == null ? 0.7 : state.volume);
  master.connect(ac.destination);

  // a gentle ceiling, so a fanfare landing on top of a chord never clips
  const squash = ac.createDynamicsCompressor();
  squash.threshold.value = -14; squash.ratio.value = 6; squash.attack.value = .004;
  squash.connect(master);

  const sfx = ac.createGain(); sfx.gain.value = 1; sfx.connect(squash);
  const amb = ac.createGain(); amb.gain.value = 0; amb.connect(squash);
  const world = ac.createGain(); world.gain.value = 1; world.connect(squash);

  /* One noise buffer, reused. Building a fresh one per footstep is the
     single most expensive thing this file could do. */
  const noiseBuf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
  const nd = noiseBuf.getChannelData(0);
  for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;

  AUD = { ac, master, sfx, amb, world, noiseBuf, ambient: null, loops: {} };
  return AUD;
}

const setVolume = v => {
  state.volume = v; save();
  if (AUD) AUD.master.gain.setTargetAtTime(v, AUD.ac.currentTime, .03);
};

/* ── one-shots ──────────────────────────────────────────────── */

function tone(freq, dur, type, gain, opts) {
  const a = sound(); if (!a) return;
  const o = opts || {}, t = a.ac.currentTime + (o.delay || 0);
  const osc = a.ac.createOscillator(), g = a.ac.createGain();
  osc.type = type || 'square';
  osc.frequency.setValueAtTime(freq, t);
  if (o.to) osc.frequency.exponentialRampToValueAtTime(Math.max(20, o.to), t + dur);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(gain, t + (o.attack || .006));
  g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  let node = osc;
  if (o.filter) { const f = a.ac.createBiquadFilter();
    f.type = o.filter; f.frequency.value = o.cutoff || 1200; f.Q.value = o.q || 1;
    osc.connect(f); node = f; }
  node.connect(g).connect(o.bus || a.sfx);
  osc.start(t); osc.stop(t + dur + .03);
}

function noise(dur, gain, opts) {
  const a = sound(); if (!a) return;
  const o = opts || {}, t = a.ac.currentTime + (o.delay || 0);
  const src = a.ac.createBufferSource();
  src.buffer = a.noiseBuf;
  src.playbackRate.value = o.rate || 1;
  const f = a.ac.createBiquadFilter();
  f.type = o.filter || 'bandpass';
  f.frequency.setValueAtTime(o.cutoff || 1400, t);
  if (o.sweep) f.frequency.exponentialRampToValueAtTime(Math.max(60, o.sweep), t + dur);
  f.Q.value = o.q || 1;
  const g = a.ac.createGain();
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(gain, t + .004);
  g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  src.connect(f).connect(g).connect(o.bus || a.sfx);
  src.start(t, Math.random() * 1.5); src.stop(t + dur + .03);
}

/* The library. Named for what happens, not for what it sounds like, so the
   call sites read as events: sfx.door(), sfx.levelUp(). */
const sfx = {
  /* footsteps — the surface picks the timbre, which is most of why a world
     feels like ground rather than a background image */
  step(surface, running) {
    const g = running ? .05 : .034;
    if (surface === 'grass') noise(.08, g, { filter: 'highpass', cutoff: 2600, q: .7, rate: 1.2 });
    else if (surface === 'water') noise(.14, g * 1.2, { filter: 'lowpass', cutoff: 900, sweep: 300 });
    else if (surface === 'deck') { noise(.07, g, { filter: 'bandpass', cutoff: 900, q: 2 });
      tone(150, .06, 'sine', g * .5); }
    else if (surface === 'carpet') noise(.06, g * .7, { filter: 'lowpass', cutoff: 700 });
    else { noise(.05, g, { filter: 'bandpass', cutoff: 1900, q: 1.6 });
      tone(220, .035, 'triangle', g * .35); }
  },
  jump() { tone(340, .1, 'square', .05, { to: 700 }); },
  land() { noise(.09, .045, { filter: 'lowpass', cutoff: 800, sweep: 200 }); },

  /* interface */
  click() { tone(760, .035, 'square', .035, { to: 900 }); },
  hover() { tone(1100, .02, 'sine', .012); },
  open() { tone(420, .1, 'sine', .04, { to: 720 }); tone(630, .12, 'triangle', .022, { delay: .04 }); },
  close() { tone(660, .09, 'sine', .034, { to: 380 }); },
  deny() { tone(190, .14, 'sawtooth', .045, { to: 130 }); },
  toast() { tone(880, .06, 'triangle', .03); tone(1320, .08, 'sine', .018, { delay: .05 }); },
  tab() { tone(520, .04, 'triangle', .028); },

  /* doors and places */
  door() {
    noise(.34, .05, { filter: 'lowpass', cutoff: 1400, sweep: 400 });
    tone(120, .3, 'sine', .05, { to: 190 });
    tone(300, .18, 'triangle', .02, { delay: .1 });
  },
  arrive() { [392, 523.25, 659.25].forEach((f, i) => tone(f, .3, 'triangle', .035, { delay: i * .06 })); },

  /* progress */
  xp() { tone(880, .07, 'triangle', .04); tone(1174.66, .1, 'sine', .028, { delay: .05 }); },
  levelUp() {
    [523.25, 659.25, 783.99, 1046.5].forEach((f, i) =>
      tone(f, i === 3 ? .5 : .16, 'triangle', .055, { delay: i * .1 }));
    [261.63, 329.63, 392].forEach((f, i) => tone(f, .7, 'sine', .03, { delay: .3 + i * .01 }));
  },
  unlockGear() {
    [659.25, 987.77, 1318.51].forEach((f, i) => tone(f, .22, 'triangle', .05, { delay: i * .08 }));
    noise(.4, .02, { filter: 'highpass', cutoff: 5000 });
  },
  badge() { tone(880, .09, 'triangle', .045); tone(1174.66, .18, 'triangle', .035, { delay: .09 }); },

  /* the games */
  match(chain) { const scale = [523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.66, 1318.51];
    const f = scale[Math.min(scale.length - 1, Math.max(0, chain - 1))];
    tone(f, .13, 'triangle', .055); tone(f * 1.5, .1, 'sine', .03, { delay: .01 }); },
  swapBack() { tone(180, .07, 'sawtooth', .04, { to: 140 }); },
  dice() { for (let i = 0; i < 5; i++)
    noise(.04, .035, { filter: 'bandpass', cutoff: 1200 + i * 260, q: 3, delay: i * .05 }); },
  capture() { tone(140, .28, 'square', .06, { to: 70 }); noise(.2, .03, { filter: 'lowpass', cutoff: 700 }); },
  piece() { tone(520, .05, 'triangle', .035); },
  home() { [659.25, 880, 1046.5].forEach((f, i) => tone(f, .2, 'triangle', .045, { delay: i * .07 })); },
  win() { sfx.levelUp(); },
  lose() { [440, 415.3, 392, 349.23].forEach((f, i) => tone(f, .2, 'sawtooth', .04, { delay: i * .13 })); },
  hitPerfect(freq) { tone(freq, .16, 'square', .05, { to: freq * 1.5 });
    tone(freq * 2, .1, 'sine', .022, { delay: .01 }); },
  hitGood(freq) { tone(freq, .12, 'triangle', .04); },
  hitMiss() { noise(.1, .035, { filter: 'lowpass', cutoff: 500 }); },
  count(n) { tone(n ? 440 : 660, .1, 'triangle', .05); },

  /* people */
  emote() { tone(700, .09, 'sine', .035, { to: 980 }); },
  chatIn() { tone(980, .05, 'sine', .022); tone(1300, .06, 'sine', .014, { delay: .04 }); },
  chatOut() { tone(660, .05, 'triangle', .026); },
  joined() { [523.25, 784].forEach((f, i) => tone(f, .16, 'sine', .03, { delay: i * .08 })); },
  strum() { [196, 246.94, 293.66, 392].forEach((f, i) =>
    tone(f, .5, 'triangle', .045, { delay: i * .035, filter: 'lowpass', cutoff: 2200 })); },

  /* the crowd, made of filtered noise rather than anybody's voice */
  cheer(strength) {
    const a = sound(); if (!a) return;
    const k = Math.max(.2, Math.min(1, strength || .7));
    noise(1.6, .05 * k, { filter: 'bandpass', cutoff: 900, q: .6, rate: .7 });
    noise(1.2, .03 * k, { filter: 'highpass', cutoff: 2200, rate: 1.4, delay: .05 });
    for (let i = 0; i < 10 * k; i++)
      noise(.06, .02 * k, { filter: 'bandpass', cutoff: 1400 + Math.random() * 2400, q: 4,
        delay: Math.random() * 1.1 });
  },
  applause() { sfx.cheer(1); setTimeout(() => sfx.cheer(.8), 700); },
};

/* ── ambience ────────────────────────────────────────────────────
   A pad per area, crossfaded rather than cut, plus a texture: birds
   on the campus by day, crickets at night, a hum in the arcade.
   ────────────────────────────────────────────────────────────── */

const AMBIENCE = {
  hub:          { root: 130.81, chord: [0, 7, 12, 16], air: 'outdoor', gain: .10 },
  arcade:       { root: 98.00,  chord: [0, 3, 7, 14],  air: 'hum',     gain: .12 },
  hq:           { root: 146.83, chord: [0, 5, 12],     air: 'room',    gain: .08 },
  'music-room': { root: 174.61, chord: [0, 4, 7, 11],  air: 'room',    gain: .09 },
  lounge:       { root: 116.54, chord: [0, 5, 9, 12],  air: 'room',    gain: .09 },
  stage:        { root: 87.31,  chord: [0, 7, 10, 15], air: 'hall',    gain: .11 },
};

function startAmbience(areaId) {
  const a = sound(); if (!a) return;
  const spec = AMBIENCE[areaId] || AMBIENCE.hub;
  const t = a.ac.currentTime;

  if (a.ambient) {
    const old = a.ambient;
    old.gain.gain.setTargetAtTime(0, t, .5);
    setTimeout(() => { try { old.stop(); } catch { /* already gone */ } }, 2600);
  }

  const bus = a.ac.createGain();
  bus.gain.setValueAtTime(0, t);
  bus.gain.linearRampToValueAtTime(spec.gain, t + 1.8);
  bus.connect(a.amb);

  const parts = [];
  spec.chord.forEach((semi, i) => {
    const osc = a.ac.createOscillator(), g = a.ac.createGain(), lfo = a.ac.createOscillator(),
      lg = a.ac.createGain(), filt = a.ac.createBiquadFilter();
    osc.type = i === 0 ? 'sine' : 'triangle';
    osc.frequency.value = spec.root * Math.pow(2, semi / 12);
    // a slow detune per voice keeps the pad from sounding like a test tone
    osc.detune.value = (i - 1.5) * 6;
    filt.type = 'lowpass'; filt.frequency.value = 700 + i * 200;
    g.gain.value = (i === 0 ? .5 : .22) / spec.chord.length;
    lfo.frequency.value = .05 + i * .017;
    lg.gain.value = g.gain.value * .5;
    lfo.connect(lg).connect(g.gain);
    osc.connect(filt).connect(g).connect(bus);
    osc.start(); lfo.start();
    parts.push(osc, lfo);
  });

  // the texture on top
  let texture = null;
  if (spec.air === 'hum') {
    const src = a.ac.createBufferSource(); src.buffer = a.noiseBuf; src.loop = true;
    const f = a.ac.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 120; f.Q.value = 8;
    const g = a.ac.createGain(); g.gain.value = .5;
    src.connect(f).connect(g).connect(bus); src.start();
    parts.push(src);
  } else if (spec.air === 'hall' || spec.air === 'room') {
    const src = a.ac.createBufferSource(); src.buffer = a.noiseBuf; src.loop = true;
    const f = a.ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 380;
    const g = a.ac.createGain(); g.gain.value = spec.air === 'hall' ? .28 : .15;
    src.connect(f).connect(g).connect(bus); src.start();
    parts.push(src);
  } else {
    // outdoors: birds by day, crickets after dark, driven by the world clock
    texture = setInterval(() => {
      if (!world || paused) return;
      const night = nightness(world.clock);
      if (night < .3) {
        if (Math.random() > .82) { const f = 1800 + Math.random() * 1400;
          tone(f, .07, 'sine', .012, { bus: a.amb });
          tone(f * 1.2, .06, 'sine', .009, { delay: .09, bus: a.amb }); }
      } else if (Math.random() > .6) {
        for (let i = 0; i < 3; i++)
          noise(.02, .008, { filter: 'bandpass', cutoff: 4200, q: 12, delay: i * .06, bus: a.amb });
      }
    }, 900);
  }

  a.ambient = {
    gain: bus,
    stop() { parts.forEach(p => { try { p.stop(); } catch {} }); if (texture) clearInterval(texture); },
  };
}

function stopAmbience() {
  if (!AUD || !AUD.ambient) return;
  AUD.ambient.gain.gain.setTargetAtTime(0, AUD.ac.currentTime, .2);
  const old = AUD.ambient; AUD.ambient = null;
  setTimeout(() => { try { old.stop(); } catch {} }, 1200);
}

/* ── the world, heard ────────────────────────────────────────────
   The fountain and the PA stacks are objects in the world with a
   position, so they get louder as you walk toward them. This is the
   cheapest possible version — one gain per source, updated a few
   times a second from the distance — and it is enough for a place to
   feel like it has a middle.
   ────────────────────────────────────────────────────────────── */

const EMITTERS = { fountain: { range: 11, kind: 'water' }, speaker: { range: 9, kind: 'pa' } };
let emitterNodes = [];

function buildEmitters() {
  const a = sound(); if (!a || !world) return;
  tearDownEmitters();
  world.area.props.forEach(p => {
    const spec = EMITTERS[p.kind]; if (!spec) return;
    const g = a.ac.createGain(); g.gain.value = 0; g.connect(a.world);
    const parts = [];
    if (spec.kind === 'water') {
      const src = a.ac.createBufferSource(); src.buffer = a.noiseBuf; src.loop = true;
      const f = a.ac.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 2600; f.Q.value = .8;
      const lfo = a.ac.createOscillator(), lg = a.ac.createGain();
      lfo.frequency.value = .3; lg.gain.value = 500;
      lfo.connect(lg).connect(f.frequency);
      src.connect(f).connect(g); src.start(); lfo.start();
      parts.push(src, lfo);
    } else {
      // a PA stack idling: mains hum plus the faintest bit of room noise
      const osc = a.ac.createOscillator(), og = a.ac.createGain();
      osc.type = 'sine'; osc.frequency.value = 50; og.gain.value = .5;
      osc.connect(og).connect(g); osc.start();
      const src = a.ac.createBufferSource(); src.buffer = a.noiseBuf; src.loop = true;
      const f = a.ac.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 6000;
      const ng = a.ac.createGain(); ng.gain.value = .12;
      src.connect(f).connect(ng).connect(g); src.start();
      parts.push(osc, src);
    }
    emitterNodes.push({ x: p.x, y: p.y, range: spec.range, gain: g, parts });
  });
}

function tearDownEmitters() {
  emitterNodes.forEach(e => e.parts.forEach(p => { try { p.stop(); } catch {} }));
  emitterNodes = [];
}

function updateEmitters() {
  if (!AUD || !world || !emitterNodes.length) return;
  const p = world.player, t = AUD.ac.currentTime;
  emitterNodes.forEach(e => {
    const d = Math.hypot(e.x - p.x, e.y - p.y);
    const v = d >= e.range ? 0 : Math.pow(1 - d / e.range, 2) * .5;
    e.gain.gain.setTargetAtTime(v, t, .12);
  });
}

/* ── footsteps, driven by the walk cycle ─────────────────────── */

let lastFootFrame = -1;

function footsteps() {
  if (!world || paused || !state.sound) return;
  const p = world.player;
  if (p.pose !== 'walk') { lastFootFrame = -1; return; }
  const running = p.input.run;
  const frame = Math.floor(p.clock * RATE.walk) % FRAMES.walk;
  // the two frames where a foot is actually down
  if ((frame === 0 || frame === 2) && frame !== lastFootFrame) {
    sfx.step(groundAt(world.area, Math.floor(p.x), Math.floor(p.y)), running);
  }
  lastFootFrame = frame;
}
</script>
