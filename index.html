   PANELS
   ════════════════════════════════════════════════════════════════ */

let panelId = null, panelNode = null;
/* Panels may start something that has to be stopped — a preview animation,
   a listener. Anything pushed here is torn down when the panel closes. */
let panelCleanup = [];

function closePanel() {
  if (panelNode) sfx.close();
  panelCleanup.forEach(fn => { try { fn(); } catch { /* nothing to undo */ } });
  panelCleanup = [];
  if (panelNode) panelNode.remove();
  panelNode = null; panelId = null;
  Object.values(ui.nav).forEach(n => n.classList.remove('on'));
}

function openPanel(id, arg) {
  closePanel();
  const build = PANELS[id];
  if (!build) return;
  panelId = id;
  if (ui.nav[id]) ui.nav[id].classList.add('on');

  const modal = el('div', 'modal');
  modal.dataset.rv = 'panel-' + id;
  modal.onclick = e => { if (e.target === modal) closePanel(); };
  const sheet = el('div', 'sheet');
  const x = el('button', 'close', '✕');
  x.dataset.rv = 'panel-close';
  x.onclick = closePanel;
  sheet.appendChild(x);
  build(sheet, arg);
  modal.appendChild(sheet);
  overlay.appendChild(modal);
  panelNode = modal;
  sfx.open();
}

function rowNode(rank, look, title, sub, right) {
  const r = el('div', 'row');
  if (rank != null) r.appendChild(el('span', 'rank', String(rank)));
  if (look) { const f = el('span', 'face'); f.appendChild(portrait(look, 30)); r.appendChild(f); }
  const mid = el('span'); mid.style.flex = '1'; mid.style.minWidth = '0';
  mid.append(el('b', '', title), el('em', '', sub));
  r.appendChild(mid);
  if (right != null) r.appendChild(el('span', 'score', right));
  return r;
}

function tabStrip(sheet, tabs, render) {
  const strip = el('div', 'tabs2');
  const body = el('div');
  let active = tabs[0][0];
  const paint = () => {
    [...strip.children].forEach(b => b.classList.toggle('on', b.dataset.k === active));
    body.innerHTML = ''; render(body, active);
  };
  tabs.forEach(([k, label]) => {
    const b = el('button', '', label); b.dataset.k = k;
    b.onclick = () => { active = k; sfx.tab(); paint(); };
    strip.appendChild(b);
  });
  sheet.append(strip, body);
  paint();
}

/* ── the map drawing, shared by the minimap and the map panel ── */

function drawMap(g, size, labels) {
  const area = world ? world.area : HUB;
  const k = size / Math.max(area.w, area.h);
  g.clearRect(0, 0, size, size);
  g.fillStyle = '#0e0b22'; g.fillRect(0, 0, size, size);

  const GC = { grass: '#1d3324', plaza: '#2c2550', path: '#3a3163', water: '#16375c',
    deck: '#3d2f26', carpet: '#2a1f4d', void: '#0e0b22' };
  const stepSize = Math.max(1, Math.round(1 / k) || 1);
  for (let y = 0; y < area.h; y += stepSize) for (let x = 0; x < area.w; x += stepSize) {
    g.fillStyle = GC[groundAt(area, x, y)] || '#1d3324';
    g.fillRect(Math.floor(x * k), Math.floor(y * k), Math.ceil(k * stepSize), Math.ceil(k * stepSize));
  }
  area.props.forEach(pr => {
    const s = BLOCK[pr.kind]; if (!s) return;
    const w = (pr.w || s[0]) * k, h = (pr.h || s[1]) * k;
    if (w < 2.5 && h < 2.5) return;
    g.fillStyle = 'rgba(190,175,255,.5)';
    g.fillRect(Math.round((pr.x - (pr.w || s[0]) / 2) * k), Math.round((pr.y - (pr.h || s[1]) / 2) * k),
      Math.max(2, Math.round(w)), Math.max(2, Math.round(h)));
  });
  area.doors.forEach(d => {
    g.fillStyle = d.color;
    g.beginPath(); g.arc(d.x * k, d.y * k, Math.max(2.5, size / 70), 0, 6.283); g.fill();
    if (labels) {
      g.font = '8px "DM Mono", monospace'; g.textAlign = 'center';
      g.fillStyle = 'rgba(239,233,255,.85)';
      g.fillText(d.label, Math.min(size - 26, Math.max(26, d.x * k)), d.y * k - 6);
    }
  });
  if (world) {
    world.actors.forEach(a => {
      g.fillStyle = a.characterId ? '#5eead4' : 'rgba(159,148,196,.55)';
      g.fillRect(Math.round(a.x * k) - 1, Math.round(a.y * k) - 1, 3, 3);
    });
    const p = world.player;
    g.fillStyle = '#fbbf24';
    g.beginPath(); g.arc(p.x * k, p.y * k, Math.max(3, size / 52), 0, 6.283); g.fill();
    g.strokeStyle = 'rgba(11,8,25,.9)'; g.lineWidth = 1.4; g.stroke();
  }
}

/* ════════════════════════════════════════════════════════════════
   INPUT
   ════════════════════════════════════════════════════════════════ */

const keys = new Set();

addEventListener('keydown', e => {
  if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
  const k = e.key.toLowerCase();
  if (k === 'escape') { if (overlay.querySelector('.gamewrap')) return; closePanel(); return; }
  if (k === 'enter') { e.preventDefault(); ui.chatInput.focus(); return; }
  if (k === 'e' || k === ' ') { e.preventDefault(); interact(); return; }
  if (k === 'm') { openPanel('map'); return; }
  keys.add(k);
  if (['w', 'a', 's', 'd', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(k)) e.preventDefault();
});
addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));
addEventListener('blur', () => keys.clear());

function keyVector() {
  const on = k => keys.has(k);
  let x = (on('d') || on('arrowright') ? 1 : 0) - (on('a') || on('arrowleft') ? 1 : 0);
  let y = (on('s') || on('arrowdown') ? 1 : 0) - (on('w') || on('arrowup') ? 1 : 0);
  return { x, y, run: keys.has('shift') };
}

/* Touch: the left half of the screen is a stick that appears where the
   thumb lands, the right half is free for buttons. Nothing is drawn
   until the screen is actually touched, so a laptop never sees it. */
const stick = $('stick');
let touchId = null, touchOrigin = null, touchVec = { x: 0, y: 0, run: false };

cvs.addEventListener('touchstart', e => {
  for (const t of e.changedTouches) {
    if (touchId !== null) break;
    if (t.clientX > innerWidth * .55) continue;
    touchId = t.identifier;
    touchOrigin = { x: t.clientX, y: t.clientY };
    stick.style.left = t.clientX + 'px';
    stick.style.top = t.clientY + 'px';
    stick.style.opacity = '1';
  }
}, { passive: true });

cvs.addEventListener('touchmove', e => {
  for (const t of e.changedTouches) {
    if (t.identifier !== touchId) continue;
    const dx = t.clientX - touchOrigin.x, dy = t.clientY - touchOrigin.y;
    const len = Math.hypot(dx, dy), max = 52;
    const k = len > max ? max / len : 1;
    stick.firstElementChild.style.transform = `translate(${dx * k}px, ${dy * k}px)`;
    const n = Math.min(1, len / 40);
    touchVec = { x: len > 6 ? dx / (len || 1) : 0, y: len > 6 ? dy / (len || 1) : 0, run: n > .92 };
  }
}, { passive: true });

const endTouch = e => {
  for (const t of e.changedTouches) {
    if (t.identifier !== touchId) continue;
    touchId = null; touchVec = { x: 0, y: 0, run: false };
    stick.style.opacity = '0';
    stick.firstElementChild.style.transform = '';
  }
};
cvs.addEventListener('touchend', endTouch, { passive: true });
cvs.addEventListener('touchcancel', endTouch, { passive: true });

/* ── the action bar ──────────────────────────────────────────── */

/* Unlocked moves are performances built out of the poses the sprite sheet
   already has, rather than new sheet columns nobody would notice. */
const MOVES = {
  spin:   { pose: 'jump',  ms: 1200, run(p, k) { p.facing = ['S', 'E', 'N', 'W'][k % 4]; } },
  bow:    { pose: 'sit',   ms: 1400 },
  guitar: { pose: 'play',  ms: 2400, run(p, k) { p.facing = k % 2 ? 'S' : 'E'; } },
};
let moveTimer = 0, moveSpin = 0;

function emote(pose) {
  const p = world.player;
  clearInterval(moveSpin); clearTimeout(moveTimer);
  const move = MOVES[pose];
  if (move) {
    p.pose = move.pose; p.clock = 0;
    let k = 0;
    if (move.run) moveSpin = setInterval(() => move.run(p, ++k), 130);
    moveTimer = setTimeout(() => { clearInterval(moveSpin); p.pose = 'idle'; p.facing = 'S'; }, move.ms);
    if (pose === 'guitar') sfx.strum(); else sfx.emote();
    return;
  }
  p.pose = p.pose === pose ? 'idle' : pose;
  p.clock = 0;
  if (p.pose === 'play') sfx.strum(); else sfx.emote();
}

function action(id) {
  switch (id) {
    case 'interact': interact(); break;
    case 'jam': launch('jam'); break;
    case 'menu': openPanel('menu'); break;
    case 'chat': toggleChat(); break;
    case 'emote':
      if (ui.buildEmotes) ui.buildEmotes();
      ui.emotes.style.display = ui.emotes.style.display === 'none' ? 'flex' : 'none';
      break;
    case 'jump': {
      const p = world.player;
      p.pose = 'jump'; p.clock = 0; sfx.jump();
      setTimeout(() => { if (p.pose === 'jump') p.pose = 'idle'; sfx.land(); }, 420);
      break;
    }
    default: openPanel(id);
  }
}

/* ── interact ────────────────────────────────────────────────────
   One chain, one order, one place. Every version of this that lived
   in two files ended up with a branch quietly missing.
   ────────────────────────────────────────────────────────────── */

function interact() {
  if (overlay.querySelector('.gamewrap')) return;
  if (panelId) { closePanel(); return; }
  if (focusedNpc) { openPanel('profile', focusedNpc.characterId); return; }
  const d = world.focused;
  if (!d) return;

  if (d.to.startsWith('panel:')) { openPanel(d.to.slice(6)); return; }
  if (d.to.startsWith('game:')) { launch(d.to.slice(5)); return; }
  if (d.to.startsWith('act:')) { doAct(d.to.slice(4)); return; }
  travel(d.to);
}

function doAct(what) {
  const p = world.player;
  if (what === 'jam' || what === 'perform') {
    p.pose = p.pose === 'play' ? 'idle' : 'play';
    p.clock = 0;
    if (p.pose === 'play') {
      unlock('first-chord');
      sfx.strum();
      setTimeout(() => sfx.cheer(.6), 500);
      toast(what === 'perform' ? 'You take the stage' : 'You pick up your instrument');
      // The room reacts. Nothing sells a crowd like a crowd that turns around.
      world.actors.forEach(a => {
        if (Math.hypot(a.x - p.x, a.y - p.y) > 8) return;
        a.goal = null; a.wait = 5 + Math.random() * 3;
        a.pose = Math.random() > .5 ? 'cheer' : 'clap'; a.clock = 0;
        a.facing = facingOf(p.x - a.x, p.y - a.y, a.facing);
        setTimeout(() => { if (a.pose === 'cheer' || a.pose === 'clap') a.pose = 'idle'; }, 4200);
      });
      grantXp(12);
    }
  }
}

function launch(which) {
  closePanel();
  const resume = () => { paused = false; hud.style.display = '';
    startAmbience(world.areaId); buildEmitters(); };
  paused = true;
  hud.style.display = 'none';
  stopAmbience(); tearDownEmitters();
  if (which === 'rush') openResoRush(resume);
  else if (which === 'ludo') {
    // one table if anybody else is here, one device if not
    if (typeof openOnlineLudo === 'function' && typeof DB !== 'undefined' && DB) openOnlineLudo(resume);
    else openResoLudo(resume);
  }
  else if (which === 'ludo-local') openResoLudo(resume);
  else if (which === 'beat') openResoBeat(resume);
  else if (which === 'gig') openResoBeat(resume, 'gig');
  else if (which === 'jam') openJam(resume);
  else if (which === 'jamstage') openJam(resume, { stage: true });
  else { resume(); toast('That cabinet is dark. Honestly.'); }
}

/* ── travel ──────────────────────────────────────────────────── */

let fading = 0;

function travel(areaId) {
  if (!AREAS[areaId]) return;
  const clock = world.clock, chat = world.chat;
  const cameFrom = world.areaId;
  world = createWorld(areaId, state.playerId);
  world.clock = clock;
  world.chat = chat;
  // Come out of a building at its door, not at the middle of the plaza.
  if (areaId === 'hub') {
    const back = HUB.doors.find(d => d.to === cameFrom);
    if (back) { world.player.x = back.x; world.player.y = back.y + 2; }
  }
  world.camera.x = world.player.x; world.camera.y = world.player.y;
  visit(areaId);
  ui.place.textContent = world.area.name;
  fading = 1;
  sfx.door();
  setTimeout(() => sfx.arrive(), 260);
  startAmbience(areaId);
  buildEmitters();
  refreshQuests();
}

/* ════════════════════════════════════════════════════════════════
   THE LOOP
   ════════════════════════════════════════════════════════════════ */

let world = null, paused = false, focusedNpc = null, last = 0, miniAt = 0, mixAt = 0;

/* How much of the campus is on screen.
 *
 * The world is drawn into a small buffer and blown up, so this is really
 * "how many CSS pixels does one world pixel get". Two on a phone, where the
 * screen is small and being close in is the whole point; less on a laptop,
 * where the same zoom would show you a fountain and nothing else. Aiming at
 * a fixed number of tiles across means a 13" laptop and a 27" monitor see
 * the same amount of campus rather than the same number of pixels. */
const TILES_ACROSS = 30;
let zoom = 2;

function resize() {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const w = innerWidth, h = innerHeight;
  /* A phone that only ever shows twelve tiles is a game played through a
     letterbox. Below one CSS pixel per world pixel the art is downscaled,
     which is a fair trade for being able to see where you are going —
     and at dpr 2 there are still two device pixels behind every one. */
  const floor = isPhone() ? 0.72 : 1;
  zoom = Math.max(floor, Math.min(2, w / (TILES_ACROSS * TW)));
  cvs.style.width = w + 'px'; cvs.style.height = h + 'px';
  cvs.width = Math.round(w * dpr); cvs.height = Math.round(h * dpr);
  // smoothing only where the picture is being made smaller than its pixels
  ctx2d.imageSmoothingEnabled = zoom < 1;
}

/* The buffer is PX world-pixels wide per drawn pixel; the transform turns
   those into the CSS pixels the zoom asked for, and then into device ones. */
const viewScale = () => zoom / PX;
addEventListener('resize', resize);

function frame(now) {
  requestAnimationFrame(frame);
  if (!world) return;
  const dt = Math.min(.05, (now - last) / 1000 || 0);
  last = now;

  if (!paused) {
    const kv = keyVector();
    const inp = world.player.input;
    inp.x = kv.x || touchVec.x;
    inp.y = kv.y || touchVec.y;
    inp.run = kv.run || touchVec.run;
    step(world, dt);

    // Nearest member you could talk to. Doors win when both are in range,
    // because a door is a deliberate walk and a person is often just nearby.
    focusedNpc = null;
    if (!world.focused) {
      let best = 2.1;
      for (const a of world.actors) {
        if (!a.characterId) continue;
        const d = Math.hypot(a.x - world.player.x, a.y - world.player.y);
        if (d < best) { best = d; focusedNpc = a; }
      }
    }
  }

  const dpr = Math.min(2, window.devicePixelRatio || 1), s = viewScale();
  ctx2d.setTransform(dpr * s, 0, 0, dpr * s, 0, 0);
  ctx2d.imageSmoothingEnabled = zoom < 1;
  render(ctx2d, world, innerWidth / s, innerHeight / s);
  ctx2d.setTransform(1, 0, 0, 1, 0, 0);

  if (fading > 0) {
    fading = Math.max(0, fading - dt * 2.2);
    ctx2d.fillStyle = 'rgba(11,8,25,' + fading + ')';
    ctx2d.fillRect(0, 0, cvs.width, cvs.height);
  }

  /* HUD updates — text only, and only when it changed. */
  const tl = timeLabel(world.clock);
  if (ui.time.textContent !== tl.time) {
    ui.time.textContent = tl.time;
    ui.phase.textContent = tl.phase;
    ui.sun.textContent = tl.phase === 'Night' ? '☾' : tl.phase === 'Evening' ? '◐' : '☀';
    ui.sun.style.color = tl.phase === 'Night' ? '#a5b4fc' : 'var(--amber)';
    if (tl.phase === 'Night' && world.clock < 60) unlock('night-owl');
  }

  const f = world.focused;
  if (f || focusedNpc) {
    const verb = f ? (f.to.startsWith('panel:') ? 'Open' : f.to.startsWith('game:') ? 'Play'
      : f.to.startsWith('act:') ? 'Do' : 'Enter') : 'Talk to';
    const label = f ? f.label : focusedNpc.name;
    const color = f ? f.color : '#5eead4';
    const wanted = verb + '␀' + label;
    if (ui.prompt.dataset.k !== wanted) {
      ui.prompt.dataset.k = wanted;
      ui.prompt.innerHTML = '';
      const b = el('b', '', verb); b.style.color = color;
      ui.prompt.append(b, el('span', '', label), el('kbd', '', 'E'));
      ui.prompt.style.borderColor = color;
    }
    ui.prompt.style.display = panelId ? 'none' : 'flex';
  } else {
    ui.prompt.style.display = 'none';
    ui.prompt.dataset.k = '';
  }

  paintChat(false);
  footsteps();
  if (now - mixAt > 140) { mixAt = now; updateEmitters(); }

  if (now - miniAt > 220) { miniAt = now; drawMap(ui.mini.getContext('2d'), 112, false); }
}

/* ════════════════════════════════════════════════════════════════
   BOOT
   ════════════════════════════════════════════════════════════════ */

let pickerOpen = false;

function pickCharacter() {
  pickerOpen = true;
  const modal = el('div', 'modal');
  modal.dataset.rv = 'picker';
  const sheet = el('div', 'sheet');
  sheet.appendChild(el('div', 'eyebrow', 'Resonance · Western Music Society, Dyal Singh College'));
  const h = el('h2', '', 'Who are you tonight?');
  sheet.appendChild(h);
  sheet.appendChild(el('p', 'body', 'Pick a member and the campus is yours. '
    + 'You can switch any time from Settings — this only decides who you walk around as.'));

  const grid = el('div');
  grid.style.cssText = 'display:grid;gap:10px;margin-top:18px;'
    + 'grid-template-columns:repeat(auto-fill,minmax(150px,1fr))';
  MEMBERS.forEach(m => {
    const b = el('button');
    b.dataset.rv = 'pick-' + m.id;
    b.style.cssText = 'display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 10px;'
      + 'border-radius:14px;cursor:pointer;color:var(--ink);'
      + 'background:rgba(139,92,246,.1);border:1px solid rgba(139,92,246,.28)';
    const face = el('div', 'portrait');
    face.style.cssText = 'width:66px;height:66px;flex:0 0 66px';
    face.appendChild(portrait(m.appearance, 64));
    b.append(face, el('b', '', m.name), el('em', '', m.title || m.role));
    b.querySelector('b').style.fontSize = '14.5px';
    b.querySelector('em').style.cssText = 'font-size:11.5px;color:var(--faint);font-style:normal;text-align:center';
    b.onmouseenter = () => { b.style.borderColor = m.appearance.outfit.accent; };
    b.onmouseleave = () => { b.style.borderColor = 'rgba(139,92,246,.28)'; };
    const live = typeof heldLive === 'function' && heldLive(m.id);
    const stale = typeof heldStale === 'function' && heldStale(m.id);
    if (live) {
      b.classList.add('taken');
      b.disabled = true;
      const who = el('span', 'badge-mine', 'PLAYING');
      who.style.color = 'var(--faint)';
      b.appendChild(who);
      b.title = m.name + ' is on the campus right now';
    } else if (stale) {
      // used before, nobody behind it — say so and let them take it
      const who = el('span', 'badge-mine', 'FREE');
      who.style.color = 'var(--teal)';
      b.appendChild(who);
      b.title = 'Last played on another device — tap to take over';
    } else if (typeof claimedByMe === 'function' && claimedByMe(m.id)) {
      b.appendChild(el('span', 'badge-mine', 'YOURS'));
    }
    b.onclick = async () => {
      if (typeof claimCharacter === 'function') {
        const res = await claimCharacter(m.id);
        if (!res.ok) { toast(m.name + ' is taken — pick somebody else'); return; }
      }
      modal.remove(); pickerOpen = false;
      const first = !state.playerId;
      state.playerId = m.id;
      if (state.xp < m.xp) state.xp = m.xp;
      save();
      if (first) unlock('founder');
      start();
    };
    grid.appendChild(b);
  });
  sheet.appendChild(grid);
  const addNew = el('button', 'btn ghost', 'Not on the list? Add yourself');
  addNew.dataset.rv = 'pick-add';
  addNew.style.cssText = 'width:100%;margin-top:14px';
  addNew.onclick = () => {
    modal.remove(); pickerOpen = false;
    // there has to be somebody to be while the form is open
    if (!state.playerId) { state.playerId = MEMBERS[0].id; save(); start(); }
    openPanel('roster', null);
  };
  sheet.appendChild(addNew);
  sheet.appendChild(el('p', 'foot', 'Everyone in the society can be here — adding a member takes '
    + 'a name and about thirty seconds.'));
  modal.appendChild(sheet);
  const old = overlay.querySelector('[data-rv="picker"]');
  if (old) old.remove();
  overlay.appendChild(modal);
}

function start() {
  const fresh = !world;
  world = createWorld('hub', state.playerId);
  visit('hub');
  buildHud();
  resize();
  ui.place.textContent = world.area.name;
  fading = 1;
  if (fresh) {
    last = performance.now();
    requestAnimationFrame(frame);
    /* A browser will not make a sound until somebody touches the page, so the
       ambience is armed on the first real interaction rather than at boot. */
    const arm = () => { startAmbience(world.areaId); buildEmitters();
      removeEventListener('pointerdown', arm); removeEventListener('keydown', arm); };
    addEventListener('pointerdown', arm); addEventListener('keydown', arm);
    // first time in, open the guide rather than hoping they find it
    setTimeout(() => {
      if (state.seenGuide) { toast('Welcome back.'); return; }
      state.seenGuide = true; save(); openPanel('guide');
    }, 900);
  }
}

/* Expose the world for the verification scripts. They drive real buttons,
   but rules are asserted against the state directly — each half catches
   bugs the other cannot see. */
window.__RV = {
  world: () => world, state: () => state, interact, travel, openPanel,
  leaderboard, quests, grantXp, unlock, closePanel,
  // late-bound: these live in scripts that have not run yet when this does
  roster: () => MEMBERS, rebuildRoster: () => rebuildRoster(), zoom: () => zoom,
  beat: (mode) => openResoBeat(() => { paused = false; hud.style.display = ''; }, mode),
  say: (text) => { world.chat.push({ who: 'you', text, tint: '#fbbf24', at: world.t });
    if (typeof sayOnline === 'function') sayOnline(text); paintChat(true); },
  peers: () => online.peers, peerActors: () => peerActors(),
  pushMemberShared: (m) => pushMemberShared(m),
  releaseCharacter: () => releaseCharacter(),
  online: () => online,
};

</script>

<script>
/* ════════════════════════════════════════════════════════════════
   RESO BEAT — the third cabinet, and the thing the Stage does.

   Four lanes, one per section of the society: voice, guitar, keys,
   drums. Notes fall, you play them, the society plays with you.

   Every note you hear is generated by an oscillator from the chart
   below. The charts are ours: a chord progression, a bass line and
   a lead written as numbers in this file, not a recording of
   anybody's song. That is the whole reason this can be shared.
   ════════════════════════════════════════════════════════════════ */

const LANES = [
  { id:'voice',  key:'d', glyph:'◉', name:'Voice',  color:'#ec4899' },
  { id:'guitar', key:'f', glyph:'◣', name:'Guitar', color:'#fbbf24' },
  { id:'keys',   key:'j', glyph:'▤', name:'Keys',   color:'#22d3ee' },
  { id:'drums',  key:'k', glyph:'⬤', name:'Drums',  color:'#a78bfa' },
];

/* Semitones above the track's root. A minor pentatonic sits under nearly
   everything a college band plays, so the lanes can never sound wrong
   together however badly the chart is hit. */
const PENTA = [0, 3, 5, 7, 10, 12, 15, 17];
const hz = (root, semi) => root * Math.pow(2, semi / 12);

const BEAT_TRACKS = [
  { id:'first-chord', name:'First Chord',  sub:'The one everybody learns',
    bpm:88,  bars:16, root:196.00, density:.30, swing:0,   color:'#22d3ee',
    chords:[0,0,5,5,3,3,7,7] },
  { id:'corridor',    name:'Corridor Jam', sub:'Outside the staff room, 2019',
    bpm:104, bars:20, root:220.00, density:.42, swing:.12, color:'#fbbf24',
    chords:[0,7,3,5] },
  { id:'freshers',    name:"Freshers' Night", sub:'The set that opens the year',
    bpm:126, bars:24, root:261.63, density:.55, swing:0,   color:'#ec4899',
    chords:[0,0,3,3,5,5,7,10] },
  { id:'crossroads',  name:'Crossroads',   sub:'The one that won it',
    bpm:148, bars:28, root:293.66, density:.68, swing:.08, color:'#a78bfa',
    chords:[0,5,3,7,0,5,10,7] },
];

/* The chart.
 *
 * Generated from the track's own numbers rather than typed out by hand, so a
 * new track is five fields and not four hundred rows — but generated from a
 * fixed seed, so "Crossroads" is the same song every time you play it. That
 * matters: a rhythm game you cannot learn is just reflexes. */
function chartFor(track) {
  const r = rng(track.id.split('').reduce((a, c) => a + c.charCodeAt(0), 7) * 2654435761);
  const notes = [], stepsPerBar = 8, beat = 60 / track.bpm, step = beat / 2;
  for (let bar = 0; bar < track.bars; bar++) {
    const build = Math.min(1, .45 + bar / track.bars);          // it gets busier
    for (let s = 0; s < stepsPerBar; s++) {
      const at = (bar * stepsPerBar + s) * step + 2.2;          // 2.2s of run-up
      const onBeat = s % 2 === 0;
      const chance = track.density * build * (onBeat ? 1.25 : .55);
      if (r() > chance) continue;
      const lane = Math.floor(r() * 4);
      notes.push({ lane, at: at + (s % 2 ? track.swing * step : 0),
        semi: PENTA[Math.floor(r() * PENTA.length)], hit: null });
      // a second lane on the downbeat, once the track has got going
      if (onBeat && bar > 2 && r() > .78) {
        const other = (lane + 1 + Math.floor(r() * 3)) % 4;
        notes.push({ lane: other, at: at + (s % 2 ? track.swing * step : 0),
          semi: PENTA[Math.floor(r() * PENTA.length)], hit: null });
      }
    }
  }
  notes.sort((a, b) => a.at - b.at);
  return { notes, length: track.bars * stepsPerBar * step + 4 };
}

/* ── the backing band ────────────────────────────────────────────
   Scheduled ahead of time against the audio clock rather than played
   from a timer, because a timer drifts and a drifting backing track
   makes an accurate chart feel broken.
   ────────────────────────────────────────────────────────────── */

function makeBand(track) {
  const ac = audio();
  if (!ac) return { start(){}, stop(){}, pump(){}, t0: performance.now() / 1000 };
  const out = ac.createGain(); out.gain.value = .5;
  out.connect((typeof sound === 'function' && sound()) ? sound().sfx : ac.destination);
  const beat = 60 / track.bpm;
  let next = 0, startedAt = 0, stopped = false;

  const voice = (freq, at, dur, type, gain, glide) => {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, at);
    if (glide) o.frequency.exponentialRampToValueAtTime(freq * glide, at + dur);
    g.gain.setValueAtTime(0, at);
    g.gain.linearRampToValueAtTime(gain, at + .012);
    g.gain.exponentialRampToValueAtTime(.0001, at + dur);
    o.connect(g).connect(out); o.start(at); o.stop(at + dur + .02);
  };
  const noise = (at, dur, gain) => {
    const n = ac.createBufferSource(), len = Math.ceil(ac.sampleRate * dur);
    const buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    n.buffer = buf;
    const g = ac.createGain(); g.gain.value = gain;
    const f = ac.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 4000;
    n.connect(f).connect(g).connect(out); n.start(at);
  };

  return {
    get t0() { return startedAt; },
    start() { startedAt = ac.currentTime + .12; next = 0; stopped = false; },
    stop() { stopped = true; out.gain.setTargetAtTime(0, ac.currentTime, .08); },
    // called every frame; schedules the next second of music and no more
    pump() {
      if (stopped || !startedAt) return;
      while (startedAt + next * beat < ac.currentTime + 1) {
        const at = startedAt + next * beat, bar = Math.floor(next / 4);
        const chordRoot = track.root * Math.pow(2, track.chords[bar % track.chords.length] / 12);
        if (next % 4 === 0) voice(chordRoot / 2, at, beat * .9, 'triangle', .13);      // bass
        else if (next % 2 === 0) voice(chordRoot / 2, at, beat * .45, 'triangle', .07);
        if (next % 4 === 2) noise(at, .11, .05);                                       // snare
        noise(at + beat * .5, .035, .022);                                             // hat
        if (bar > 1) voice(hz(chordRoot, PENTA[(next * 3) % PENTA.length]) * 2,
          at + beat * .5, beat * .3, 'square', .028);                                  // arp
        next++;
      }
    },
    hit(semi, root) { voice(hz(root, semi) * 2, ac.currentTime, .18, 'square', .06, 1.5); },
    clank() { voice(90, ac.currentTime, .12, 'sawtooth', .05, .6); },
  };
}

/* ── the game ───────────────────────────────────────────────── */

function openResoBeat(onExit, mode) {
  const gig = mode === 'gig';
  const host = document.createElement('div'); host.className = 'gamewrap'; host.dataset.rv = 'game';
  document.getElementById('overlay').appendChild(host);
  const close = () => { host.remove(); onExit && onExit(); };

  function menu() {
    host.innerHTML = '';
    host.appendChild(topBar(gig ? 'THE STAGE' : 'RESO BEAT', close));
    const body = el('div', 'gbody'); host.appendChild(body);
    const wrap = el('div'); wrap.style.maxWidth = '560px'; body.appendChild(wrap);
    wrap.appendChild(el('h2', '', gig ? 'What are you playing?' : 'Pick a track'));
    wrap.appendChild(el('p', 'body', gig
      ? 'The room is full. Choose a track and play it — how well you play is how loud they get.'
      : 'Four lanes, one per section. Hit them as they land. Every note is made by the browser, '
        + 'so nothing here belongs to anybody but us.'));

    const grid = el('div');
    grid.style.cssText = 'display:grid;gap:8px;margin-top:16px';
    wrap.appendChild(grid);
    BEAT_TRACKS.forEach((tr, i) => {
      const best = (state.beat || {})[tr.id];
      const b = el('button', 'row');
      b.dataset.rv = 'beat-' + tr.id;
      b.style.cssText = 'text-align:left;cursor:pointer;border-left:3px solid ' + tr.color;
      b.innerHTML = `<span class="rank">${i + 1}</span><span style="flex:1">
        <b>${tr.name}</b><em>${tr.sub} · ${tr.bpm} BPM</em></span>
        <span class="score">${best ? best.acc + '%' : '—'}</span>`;
      b.onclick = () => play(tr);
      grid.appendChild(b);
    });

    const keys = el('div', 'chips'); keys.style.marginTop = '16px';
    LANES.forEach(l => { const c = el('span', 'chip on', l.name + '  ' + l.key.toUpperCase());
      c.style.borderColor = l.color; keys.appendChild(c); });
    wrap.appendChild(keys);
    wrap.appendChild(el('p', 'foot', 'On a phone, tap the four pads instead of the keys.'));
  }

  function play(track) {
    const chart = chartFor(track);
    const band = makeBand(track);
    let score = 0, combo = 0, best = 0, perfect = 0, good = 0, missed = 0, crowd = gig ? .45 : .6;
    let raf = 0, done = false, startWall = 0;
    const lit = [0, 0, 0, 0];   // lane flash on a hit

    host.innerHTML = '';
    host.appendChild(topBar(track.name, () => { stop(); close(); }, () => { stop(); menu(); },
      gig ? 'Other track' : 'Tracks'));
    const body = el('div', 'gbody'); host.appendChild(body);

    const stage = el('div', 'beat'); body.appendChild(stage);
    const cvsB = document.createElement('canvas'); stage.appendChild(cvsB);
    const g = cvsB.getContext('2d');

    const bar = el('div', 'crowdbar'); const barFill = el('i'); bar.appendChild(barFill);
    stage.appendChild(bar);
    const comboEl = el('div', 'combo2'); stage.appendChild(comboEl);

    const pads = el('div', 'pads'); stage.appendChild(pads);
    const padEls = LANES.map(l => {
      const b = el('button', 'pad');
      b.dataset.rv = 'pad-' + l.id;
      b.style.color = l.color;
      b.append(document.createTextNode(l.glyph), el('b', '', l.key.toUpperCase()));
      const down = e => { e.preventDefault(); strike(LANES.indexOf(l)); };
      b.addEventListener('pointerdown', down);
      pads.appendChild(b);
      return b;
    });

    const side = el('div', 'stats'); body.appendChild(side);
    const sScore = statBox('Score', '0');
    const sCombo = statBox('Combo', 'x1');
    const sAcc = statBox('Accuracy', '—');
    const sCrowd = statBox(gig ? 'The room' : 'Groove', 'warming up');
    [sScore, sCombo, sAcc, sCrowd].forEach(x => side.appendChild(x.node));
    side.appendChild(el('p', 'foot', 'D F J K, or tap the pads. Miss a run of notes and the room cools off.'));

    /* ── judging ── */
    const PERFECT = .065, GOOD = .13;
    const judgeEl = () => { const j = stage.querySelector('.judge'); if (j) j.remove(); };
    const showJudge = (text, color) => {
      judgeEl();
      const j = el('div', 'judge', text);
      j.style.color = color; j.style.animation = 'judge .45s ease-out forwards';
      stage.appendChild(j);
      setTimeout(() => j.remove(), 460);
    };

    const now = () => (performance.now() - startWall) / 1000;

    function strike(lane) {
      if (done) return;
      const b = padEls[lane]; b.classList.add('hit'); setTimeout(() => b.classList.remove('hit'), 90);
      lit[lane] = .22;
      const t = now();
      let target = null, bestDt = 1e9;
      for (const n of chart.notes) {
        if (n.lane !== lane || n.hit) continue;
        const dt = Math.abs(n.at - t);
        if (dt < bestDt) { bestDt = dt; target = n; }
        if (n.at - t > GOOD) break;
      }
      if (!target || bestDt > GOOD) { combo = 0; sfx.hitMiss();
        showJudge('off', '#6f679a'); refresh(); return; }
      const isPerfect = bestDt <= PERFECT;
      target.hit = isPerfect ? 'perfect' : 'good';
      if (isPerfect) { perfect++; score += 150 + combo * 12; }
      else { good++; score += 70 + combo * 6; }
      combo++; best = Math.max(best, combo);
      crowd = Math.min(1, crowd + (isPerfect ? .028 : .015));
      band.hit && band.hit(target.semi, track.root);
      (isPerfect ? sfx.hitPerfect : sfx.hitGood)(hz(track.root, target.semi) * 2);
      showJudge(isPerfect ? 'PERFECT' : 'good', isPerfect ? LANES[lane].color : '#c9c0ea');
      if (combo === 25) unlock('perfect');
      refresh();
    }

    function refresh() {
      sScore.set(score.toLocaleString());
      sCombo.set('x' + Math.max(1, combo));
      const played = perfect + good + missed;
      sAcc.set(played ? Math.round(((perfect + good * .5) / played) * 100) + '%' : '—');
      sCrowd.set(crowd > .85 ? 'going off' : crowd > .6 ? 'with you' : crowd > .35 ? 'watching' : 'losing them');
      barFill.style.width = (crowd * 100) + '%';
      comboEl.textContent = combo >= 5 ? combo + ' in a row' : '';
    }

    /* ── the highway ── */
    function draw() {
      const W = stage.clientWidth, H = stage.clientHeight;
      const dpr = Math.min(2, devicePixelRatio || 1);
      if (cvsB.width !== Math.round(W * dpr)) { cvsB.width = Math.round(W * dpr); cvsB.height = Math.round(H * dpr); }
      g.setTransform(dpr, 0, 0, dpr, 0, 0);
      g.clearRect(0, 0, W, H);

      const padTop = H - (pads.clientHeight || 86);
      const hitY = padTop - 6, lead = 1.9, laneW = W / 4;
      const t = now();

      // lanes
      LANES.forEach((l, i) => {
        const grd = g.createLinearGradient(0, 0, 0, hitY);
        grd.addColorStop(0, 'rgba(255,255,255,0)');
        grd.addColorStop(1, l.color + '1f');
        g.fillStyle = grd; g.fillRect(i * laneW + 2, 0, laneW - 4, hitY);
        g.fillStyle = 'rgba(255,255,255,.07)'; g.fillRect(i * laneW + laneW - 1, 0, 1, hitY);
      });

      // bar lines, so you can see how fast the track is coming at you
      const beat = 60 / track.bpm, ph = ((t % beat) / beat);
      g.fillStyle = 'rgba(255,255,255,.05)';
      for (let k = 0; k < 9; k++) {
        const bt = Math.ceil(t / beat) * beat + k * beat, dtb = bt - t;
        if (dtb > lead) break;
        const yb = hitY - (dtb / lead) * hitY;
        g.fillRect(0, Math.round(yb), W, Math.round(bt / beat) % 4 === 0 ? 2 : 1);
      }

      // the targets you are aiming at, and the line they sit on
      LANES.forEach((l, i) => {
        const x = i * laneW + laneW / 2, wN = laneW - 18;
        g.strokeStyle = l.color + '66'; g.lineWidth = 2;
        g.strokeRect(Math.round(x - wN / 2), Math.round(hitY - 9), wN, 18);
        if (lit[i] > 0) {
          g.globalAlpha = lit[i]; g.fillStyle = l.color;
          g.fillRect(Math.round(x - wN / 2), 0, wN, hitY);
          g.globalAlpha = 1; lit[i] = Math.max(0, lit[i] - .06);
        }
      });
      g.fillStyle = 'rgba(255,255,255,' + (.28 + (1 - ph) * .34) + ')';
      g.fillRect(0, hitY - 1, W, 2);

      // notes
      for (const n of chart.notes) {
        if (n.hit) continue;
        const dt = n.at - t;
        if (dt > lead || dt < -GOOD) continue;
        const y = hitY - (dt / lead) * hitY;
        const l = LANES[n.lane], x = n.lane * laneW + laneW / 2;
        const wNote = laneW - 18, hNote = 16;
        g.globalAlpha = Math.min(1, .45 + ((lead - dt) / lead) * 1.4);
        // a soft halo so a note reads against the lane wash
        g.fillStyle = l.color + '33';
        g.fillRect(Math.round(x - wNote / 2) - 3, Math.round(y - hNote / 2) - 3, wNote + 6, hNote + 6);
        g.fillStyle = l.color;
        g.fillRect(Math.round(x - wNote / 2), Math.round(y - hNote / 2), wNote, hNote);
        g.fillStyle = 'rgba(255,255,255,.7)';
        g.fillRect(Math.round(x - wNote / 2), Math.round(y - hNote / 2), wNote, 3);
        g.fillStyle = 'rgba(0,0,0,.28)';
        g.fillRect(Math.round(x - wNote / 2), Math.round(y + hNote / 2) - 2, wNote, 2);
        g.globalAlpha = 1;
      }

      // the society, playing along at the back
      if (gig) {
        g.globalAlpha = .5 + crowd * .5;
        const bob = Math.sin(t * (60 / beat) * .1) * 2;
        g.globalAlpha = 1;
        g.fillStyle = 'rgba(255,255,255,' + (.05 + crowd * .1) + ')';
        g.fillRect(0, 0, W, 40 + bob);
      }
      return t;
    }

    function frame() {
      if (done) return;
      raf = requestAnimationFrame(frame);
      band.pump();
      const t = draw();

      // notes that went past
      for (const n of chart.notes) {
        if (n.hit || n.at > t - GOOD) continue;
        n.hit = 'miss'; missed++; combo = 0;
        crowd = Math.max(0, crowd - .022);
        refresh();
      }
      if (t > chart.length) finish();
    }

    function stop() { done = true; cancelAnimationFrame(raf); band.stop(); removeEventListener('keydown', onKey); }

    function onKey(e) {
      if (e.repeat) return;
      const i = LANES.findIndex(l => l.key === e.key.toLowerCase());
      if (i >= 0) { e.preventDefault(); e.stopPropagation(); strike(i); }
    }
    addEventListener('keydown', onKey, true);

    function finish() {
      stop();
      const played = perfect + good + missed || 1;
      const acc = Math.round(((perfect + good * .5) / played) * 100);
      state.beat = state.beat || {};
      const prior = state.beat[track.id];
      if (!prior || acc > prior.acc) state.beat[track.id] = { acc, score };
      submitScore('beat', state.playerId, score, acc);
      const xp = Math.round(score / 120) + (acc >= 90 ? 60 : acc >= 70 ? 25 : 0);
      if (acc >= 95) unlock('perfect');
      acc >= 60 ? sfx.win() : sfx.lose();
      if (gig && crowd > .4) setTimeout(() => sfx.applause(), 300);

      const back = el('div');
      back.style.cssText = 'position:absolute;inset:0;display:grid;place-items:center;z-index:20;'
        + 'background:rgba(7,6,15,.86);backdrop-filter:blur(6px);padding:18px';
      const card = el('div');
      card.style.cssText = 'max-width:380px;width:100%;padding:24px;border-radius:18px;'
        + 'background:linear-gradient(168deg,#1a1540,#120e2c);border:1px solid rgba(139,92,246,.4)';
      card.appendChild(el('div', 'eyebrow', gig ? 'The room' : 'Track complete'));
      card.appendChild(el('h2', '', gig
        ? (crowd > .8 ? 'They lost it.' : crowd > .5 ? 'Good set.' : 'Rough one.')
        : (acc >= 90 ? 'Clean run.' : acc >= 70 ? 'Solid.' : 'Keep at it.')));
      const rows = el('div', 'rows');
      [['Accuracy', acc + '%'], ['Perfect', String(perfect)], ['Good', String(good)],
       ['Missed', String(missed)], ['Best combo', 'x' + best], ['Score', score.toLocaleString()]]
        .forEach(([k, v]) => rows.appendChild(rowNode(null, null, k, '', v)));
      card.appendChild(rows);
      if (xp) card.appendChild(el('div', 'chip on', '+' + xp + ' XP'));
      const btns = el('div'); btns.style.cssText = 'display:flex;gap:8px;margin-top:18px';
      const again = el('button', 'btn', 'Again'); again.style.flex = '1';
      again.onclick = () => { back.remove(); play(track); };
      const out = el('button', 'btn ghost', 'Done'); out.style.flex = '1';
      out.dataset.rv = 'beat-done';
      out.onclick = () => { back.remove(); menu(); };
      btns.append(again, out); card.appendChild(btns);
      back.appendChild(card); host.appendChild(back);
      if (xp) grantXp(xp);
      if (gig) applause(crowd);
      save();
    }

    // three, two, one
    const count = el('div', 'judge', '3');
    count.style.color = track.color; stage.appendChild(count);
    let n = 3;
    const tick = setInterval(() => {
      n--; sfx.count(n);
      count.textContent = n || 'GO';
      if (n < 0) {
        clearInterval(tick); count.remove();
        startWall = performance.now(); band.start(); refresh(); frame();
      }
    }, 700);
    sfx.count(1);
    refresh();
  }

  menu();
}

/* When you come off stage the room reacts — the same actors that were
   standing around before, now all facing you and cheering. */
function applause(crowd) {
  const w = window.__RV && window.__RV.world();
  if (!w) return;
  sfx.applause();
  const p = w.player;
  w.actors.forEach(a => {
    if (Math.hypot(a.x - p.x, a.y - p.y) > 11) return;
    a.goal = null; a.wait = 6 + Math.random() * 3;
    a.pose = crowd > .5 ? (Math.random() > .4 ? 'cheer' : 'clap') : 'idle';
    a.clock = 0;
    a.facing = facingOf(p.x - a.x, p.y - a.y, a.facing);
    if (crowd > .7 && Math.random() > .5) {
      const text = ['THAT WAS UNREAL', 'again! again!', 'ok that goes hard', 'RESONANCE'][
        Math.floor(Math.random() * 4)];
      a.say = { text, left: 5 };
      w.chat.push({ who: a.name, text, tint: '#fbbf24', at: w.t });
    }
    setTimeout(() => { if (a.pose === 'cheer' || a.pose === 'clap') a.pose = 'idle'; }, 5200);
  });
  p.pose = 'wave'; p.clock = 0;
  setTimeout(() => { if (p.pose === 'wave') p.pose = 'idle'; }, 2200);
}
</script>

<script>
/* ════════════════════════════════════════════════════════════════
   THE ROSTER EDITOR

   The acceptance test for the character system was always "adding a
   member must not mean rewriting anything". This is that test taken
   to its conclusion: you add a member from inside the game, on a
   phone, without opening a file.

   A member added here is the same shape as one in the seed list, so
   they walk the campus, have a room, appear in the Hall of Fame and
   can take a Ludo seat the moment you save them.
   ════════════════════════════════════════════════════════════════ */

const ROLES = ['vocalist', 'guitarist', 'bassist', 'drummer', 'keyboardist',
  'saxophonist', 'producer', 'core', 'member'];
const HAIR_STYLES = ['short-crop', 'wavy-mid', 'curly-volume', 'bowl-fringe', 'long-straight'];
const OUTFIT_STYLES = ['tee', 'hoodie-zip', 'jacket-open', 'shirt-tie'];
const SHOE_STYLES = ['sneakers-low', 'sneakers-hi', 'boots'];
const ACCESSORIES = ['glasses', 'headphones', 'backpack', 'lanyard', 'wristband'];

const SKIN_SWATCHES = ['#f7d5b5', '#f0c49a', '#e0aa7e', '#d99e74', '#c98b5f', '#b97a52', '#9c6340', '#7d4b2e', '#5f3a24'];
const HAIR_SWATCHES = ['#141018', '#1f1a2e', '#2b1d16', '#3d2a1c', '#4a3628', '#6b4a2f', '#8d6b4a', '#b03a5b', '#2f7d4f'];
const CLOTH_SWATCHES = ['#232744', '#2b2450', '#3a2f5e', '#d8262b', '#c2410c', '#0f766e', '#6d28d9',
  '#1d4ed8', '#334155', '#4a1d3f', '#155e56', '#7c2d5a', '#efe7dc', '#1a1a20'];
const ACCENT_SWATCHES = ['#8b5cf6', '#22d3ee', '#ec4899', '#fbbf24', '#5eead4', '#f472b6', '#a3e635', '#fb7185'];

/* An id that will never collide with a seed member or with itself.
 *
 * `taken` is passed in when a whole list is being normalised at once — two
 * people called David arriving in the same share code have to come out with
 * two different ids, and checking against the live roster cannot see the one
 * being built alongside them. */
function slugFor(name, taken) {
  const base = (name || 'member').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'member';
  const used = taken || new Set(MEMBERS.map(m => m.id));
  let id = base, n = 2;
  while (used.has(id)) id = base + '-' + (n++);
  used.add(id);
  return id;
}

function blankMember() {
  return {
    id: null, name: '', role: 'member', title: '', hometown: '', tagline: '', bio: '', xp: 0,
    custom: true,
    appearance: {
      skinTone: '#d99e74',
      hair: { style: 'short-crop', color: '#1f1a2e' },
      outfit: { style: 'tee', primary: '#2b2450', secondary: '#3f4a63', accent: '#8b5cf6' },
      shoes: { style: 'sneakers-low', primary: '#e9e4dc', accent: '#8b5cf6' },
      accessories: [],
    },
  };
}

/* Anything loaded from a save is filled in against the blank, so an older
   save or a hand-edited share code can never produce a half-drawn person. */
function normaliseMember(raw, taken) {
  const b = blankMember(), a = raw.appearance || {};
  let id = raw.id;
  if (!id || (taken && taken.has(id))) id = slugFor(raw.name, taken);
  else if (taken) taken.add(id);
  return {
    id, name: raw.name || 'Member',
    role: ROLES.includes(raw.role) ? raw.role : 'member',
    title: raw.title || '', hometown: raw.hometown || '',
    tagline: raw.tagline || '', bio: raw.bio || '', xp: Number(raw.xp) || 0, custom: true,
    appearance: {
      skinTone: a.skinTone || b.appearance.skinTone,
      hair: { style: HAIR_STYLES.includes((a.hair || {}).style) ? a.hair.style : 'short-crop',
        color: (a.hair || {}).color || b.appearance.hair.color },
      outfit: { style: OUTFIT_STYLES.includes((a.outfit || {}).style) ? a.outfit.style : 'tee',
        primary: (a.outfit || {}).primary || b.appearance.outfit.primary,
        secondary: (a.outfit || {}).secondary || b.appearance.outfit.secondary,
        accent: (a.outfit || {}).accent || b.appearance.outfit.accent },
      shoes: { style: SHOE_STYLES.includes((a.shoes || {}).style) ? a.shoes.style : 'sneakers-low',
        primary: (a.shoes || {}).primary || b.appearance.shoes.primary,
        accent: (a.shoes || {}).accent || b.appearance.shoes.accent },
      accessories: (a.accessories || []).filter(x => ACCESSORIES.includes(x)),
    },
  };
}

const SEED_IDS = new Set(SEED_MEMBERS.map(m => m.id));

function rebuildRoster() {
  /* An entry carrying one of the original ids is an EDIT of that member, not
     a name clash — Juman with a new haircut is still Juman, and everything
     that points at 'juman' (claims, scores, Ludo seats) keeps pointing at
     him. Anything else is a new person and gets a fresh id. */
  const taken = new Set(SEED_IDS);
  state.custom = (state.custom || []).map(raw =>
    (raw.id && SEED_IDS.has(raw.id)) ? normaliseMember(raw, null) : normaliseMember(raw, taken));
  const edited = new Map(state.custom.filter(m => SEED_IDS.has(m.id)).map(m => [m.id, m]));
  MEMBERS = SEED_MEMBERS.map(m => edited.get(m.id) || m)
    .concat(state.custom.filter(m => !SEED_IDS.has(m.id)));
  // a member you were playing as may have been removed; nobody chosen yet is
  // a different thing entirely and must still get the picker
  if (state.playerId && !MEMBERS.some(m => m.id === state.playerId)) state.playerId = MEMBERS[0].id;
}

/* Saving the roster changes who is standing on the campus, so the world is
   rebuilt in place — same area, same clock, same conversation. */
function rosterChanged() {
  rebuildRoster();
  save();
  if (!world) return;
  const areaId = world.areaId, clock = world.clock, chat = world.chat;
  const at = { x: world.player.x, y: world.player.y };
  world = createWorld(areaId, state.playerId);
  world.clock = clock; world.chat = chat;
  world.player.x = at.x; world.player.y = at.y;
  world.camera.x = at.x; world.camera.y = at.y;
  refreshMe();
}

/* ── the editor panel ────────────────────────────────────────── */

PANELS.roster = function (sheet, editId) {
  sheet.appendChild(el('div', 'eyebrow', 'Resonance'));
  sheet.appendChild(el('h2', '', 'The society'));

  if (editId === undefined) {
    sheet.appendChild(el('p', 'body', 'Everyone here walks the campus, has a room and can take a '
      + 'seat at Reso Ludo. Tap anybody to change their look, role or bio — founders included — '
      + 'or add the rest of the society and they are in the world immediately.'));

    const rows = el('div', 'rows'); rows.style.margin = '16px 0';
    MEMBERS.forEach(m => {
      const isEdited = SEED_IDS.has(m.id) && m.custom;
      const r = rowNode(null, m.appearance, m.name,
        (m.title || m.role) + (isEdited ? ' · edited' : ''), null);
      const edit = el('button', 'chip on', 'Edit');
      edit.style.cursor = 'pointer';
      edit.dataset.rv = 'roster-edit-' + m.id;
      edit.onclick = () => openPanel('roster', m.id);
      r.appendChild(edit);
      rows.appendChild(r);
    });
    sheet.appendChild(rows);

    const add = el('button', 'btn', '+  Add a member');
    add.dataset.rv = 'roster-add';
    add.style.width = '100%';
    add.onclick = () => openPanel('roster', null);
    sheet.appendChild(add);
    const sh = el('button', 'btn ghost', 'Send this society to everyone');
    sh.style.cssText = 'width:100%;margin-top:8px';
    sh.onclick = () => openPanel('share');
    sheet.appendChild(sh);
    sheet.appendChild(el('p', 'foot', 'Members you add live in this browser. '
      + 'The code above carries them to anybody else’s copy.'));
    return;
  }

  /* ── the form ── */
  const existing = editId ? MEMBERS.find(m => m.id === editId) : null;
  const readOnly = false;                       // everyone is editable, founders included
  const isSeed = !!(existing && SEED_IDS.has(existing.id));
  const draft = existing ? JSON.parse(JSON.stringify(existing)) : blankMember();
  if (existing) draft.custom = true;

  sheet.querySelector('h2').textContent = existing ? existing.name : 'New member';

  const form = el('div', 'form');
  sheet.appendChild(form);

  /* live preview — the same sprite sheet the campus uses, so what you see
     here is exactly who walks out of the door */
  const preview = el('div', 'preview');
  const shot = document.createElement('canvas');
  shot.width = SW * 3; shot.height = SH * 3;
  shot.style.cssText = 'width:' + SW * 3 + 'px;height:' + SH * 3 + 'px';
  const pg = shot.getContext('2d');
  const caption = el('div');
  preview.append(shot, caption);
  form.appendChild(preview);

  let tick = 0;
  const paintPreview = () => {
    pg.imageSmoothingEnabled = false;
    pg.clearRect(0, 0, shot.width, shot.height);
    drawSprite(pg, draft.appearance, {
      x: shot.width / 2, y: SH * 3 - 3, dir: 'S', pose: 'idle',
      frame: Math.floor(tick / 24) % FRAMES.idle,
      instrument: 'none', scale: 3,
    });
    caption.innerHTML = '';
    caption.append(
      el('b', '', draft.name || 'Unnamed'),
      el('div', 'role', draft.role + (draft.title ? ' · ' + draft.title : '')),
      el('div', 'mini-note', ROLE_INSTRUMENT[draft.role]
        ? 'Plays the ' + ROLE_INSTRUMENT[draft.role] + ' on stage.' : ''));
    caption.querySelector('b').style.fontSize = '16px';
  };
  const spin = setInterval(() => { tick++; paintPreview(); }, 90);
  // the panel owns the timer; closing it must not leave one running
  const stopSpin = () => clearInterval(spin);
  panelCleanup.push(stopSpin);

  const field = (label, node) => {
    const f = el('div', 'field');
    f.append(el('span', '', label), node);
    return f;
  };
  const input = (value, onInput, placeholder, max) => {
    const i = el('input'); i.value = value || ''; i.placeholder = placeholder || '';
    i.maxLength = max || 40; i.disabled = readOnly;
    i.oninput = () => { onInput(i.value); paintPreview(); };
    i.onkeydown = e => e.stopPropagation();
    return i;
  };
  const select = (options, value, onChange) => {
    const sEl = el('select'); sEl.disabled = readOnly;
    options.forEach(o => { const op = el('option', '', o); op.value = o; sEl.appendChild(op); });
    sEl.value = value;
    sEl.onchange = () => { onChange(sEl.value); paintPreview(); };
    return sEl;
  };
  const swatches = (list, value, onPick) => {
    const box = el('div', 'swatches');
    list.forEach(c => {
      const b = el('button', 'sw' + (c === value ? ' on' : ''));
      b.style.background = c; b.disabled = readOnly; b.title = c;
      b.onclick = () => {
        [...box.children].forEach(x => x.classList.remove('on'));
        b.classList.add('on'); onPick(c); paintPreview();
      };
      box.appendChild(b);
    });
    return box;
  };

  const two = (a, b) => { const g = el('div', 'two'); g.append(a, b); return g; };

  form.appendChild(two(
    field('Name', input(draft.name, v => draft.name = v, 'Riya', 22)),
    field('Role', select(ROLES, draft.role, v => draft.role = v))));
  form.appendChild(two(
    field('Title in the society', input(draft.title, v => draft.title = v, 'Lead Guitar', 28)),
    field('Hometown', input(draft.hometown, v => draft.hometown = v, 'Pune', 24))));
  form.appendChild(field('One line about them',
    input(draft.tagline, v => draft.tagline = v, 'Plays loud, tunes never.', 60)));

  const bio = el('textarea'); bio.value = draft.bio; bio.maxLength = 240; bio.disabled = readOnly;
  bio.placeholder = 'What they do in the society, in a sentence or two.';
  bio.oninput = () => draft.bio = bio.value;
  bio.onkeydown = e => e.stopPropagation();
  form.appendChild(field('Bio', bio));

  form.appendChild(el('div', 'eyebrow', 'How they look'));
  form.appendChild(field('Skin', swatches(SKIN_SWATCHES, draft.appearance.skinTone,
    c => draft.appearance.skinTone = c)));
  form.appendChild(two(
    field('Hair', select(HAIR_STYLES, draft.appearance.hair.style, v => draft.appearance.hair.style = v)),
    field('Hair colour', swatches(HAIR_SWATCHES, draft.appearance.hair.color,
      c => draft.appearance.hair.color = c))));
  form.appendChild(two(
    field('Outfit', select(OUTFIT_STYLES, draft.appearance.outfit.style, v => draft.appearance.outfit.style = v)),
    field('Shoes', select(SHOE_STYLES, draft.appearance.shoes.style, v => draft.appearance.shoes.style = v))));
  form.appendChild(field('Top', swatches(CLOTH_SWATCHES, draft.appearance.outfit.primary,
    c => draft.appearance.outfit.primary = c)));
  form.appendChild(field('Trousers', swatches(CLOTH_SWATCHES, draft.appearance.outfit.secondary,
    c => draft.appearance.outfit.secondary = c)));
  form.appendChild(field('Accent', swatches(ACCENT_SWATCHES, draft.appearance.outfit.accent,
    c => { draft.appearance.outfit.accent = c; draft.appearance.shoes.accent = c; })));

  const accBox = el('div', 'chips');
  ACCESSORIES.forEach(a => {
    const on = () => draft.appearance.accessories.includes(a);
    const c = el('button', 'chip' + (on() ? ' on' : ''), a);
    c.style.cursor = 'pointer'; c.disabled = readOnly;
    c.onclick = () => {
      const list = draft.appearance.accessories;
      const i = list.indexOf(a);
      if (i >= 0) list.splice(i, 1); else list.push(a);
      c.className = 'chip' + (on() ? ' on' : ''); paintPreview();
    };
    accBox.appendChild(c);
  });
  form.appendChild(field('Extras', accBox));

  paintPreview();

  const btns = el('div');
  btns.style.cssText = 'display:flex;gap:8px;flex-wrap:wrap;margin-top:4px';

  {
    const savebtn = el('button', 'btn', existing ? 'Save changes' : 'Add to the society');
    savebtn.dataset.rv = 'roster-save';
    savebtn.style.flex = '1';
    savebtn.onclick = () => {
      if (!draft.name.trim()) { toast('They need a name first'); return; }
      draft.name = draft.name.trim();
      if (existing) {
        // editing one of the originals writes an override under the same id,
        // so nothing that already refers to them breaks
        draft.id = existing.id;
        state.custom = state.custom || [];
        const i = state.custom.findIndex(m => m.id === existing.id);
        if (i >= 0) state.custom[i] = draft; else state.custom.push(draft);
      } else {
        draft.id = slugFor(draft.name);
        state.custom = state.custom || [];
        state.custom.push(draft);
      }
      rosterChanged();
      if (typeof pushMemberShared === 'function') pushMemberShared(draft);
      unlock('recruiter');
      closePanel();
      toast(draft.name + ' is on the campus');
      sfx.joined();
    };
    btns.appendChild(savebtn);

    const cancel = el('button', 'btn ghost', 'Cancel');
    cancel.onclick = () => openPanel('roster');
    btns.appendChild(cancel);

    if (existing && isSeed) {
      /* An original cannot leave — the society was founded on them — but the
         edit can be undone, which is the thing anybody actually wants. */
      const seed = SEED_MEMBERS.find(m => m.id === existing.id);
      const reset = el('button', 'btn ghost', 'Back to the original');
      reset.dataset.rv = 'roster-reset';
      reset.disabled = !existing.custom;
      if (!existing.custom) reset.style.opacity = '.45';
      reset.onclick = () => {
        state.custom = (state.custom || []).filter(m => m.id !== existing.id);
        if (typeof removeMemberShared === 'function') removeMemberShared(existing.id);
        rosterChanged();
        openPanel('roster', existing.id);
        toast(seed.name + ' is back as they were');
      };
      btns.appendChild(reset);
    } else if (existing) {
      const del = el('button', 'btn ghost', 'Remove');
      del.style.color = '#fb7185';
      del.dataset.rv = 'roster-remove';
      del.onclick = () => {
        if (del.dataset.armed !== '1') { del.dataset.armed = '1'; del.textContent = 'Tap again to remove'; return; }
        state.custom = state.custom.filter(m => m.id !== existing.id);
        if (typeof removeMemberShared === 'function') removeMemberShared(existing.id);
        rosterChanged();
        openPanel('roster');
        toast(existing.name + ' left the society');
      };
      btns.appendChild(del);
    }
  }
  form.appendChild(btns);
};

<script>
/* ════════════════════════════════════════════════════════════════
   SHARING

   There is no server, which is a feature: nothing to pay for, nothing
   to keep running, nothing to leak. The cost is that a browser only
   knows what is in its own storage, so anything that has to travel —
   the society you built, the progress you made — travels as a code
   you can paste into a message.
   ════════════════════════════════════════════════════════════════ */

const CODE_PREFIX = 'RESO1:';

/* base64url over UTF-8. btoa only speaks latin-1, so the text is escaped
   first — otherwise a name with an accent in it silently breaks the code. */
const packCode = obj => CODE_PREFIX + btoa(unescape(encodeURIComponent(JSON.stringify(obj))))
  .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');

function readCode(text) {
  const raw = (text || '').trim().replace(/\s+/g, '');
  if (!raw.startsWith(CODE_PREFIX)) return null;
  try {
    let b = raw.slice(CODE_PREFIX.length).replace(/-/g, '+').replace(/_/g, '/');
    while (b.length % 4) b += '=';
    const obj = JSON.parse(decodeURIComponent(escape(atob(b))));
    return obj && typeof obj === 'object' ? obj : null;
  } catch { return null; }
}

const societyCode = () => packCode({ k: 'society', m: state.custom || [] });
const progressCode = () => packCode({
  k: 'progress', p: state.playerId, x: myXp(), u: state.unlocked,
  v: state.visited, s: state.scores.slice(0, 20), b: state.beat || {},
  pl: state.played, m: state.custom || [],
});

/* Importing never overwrites: a member you already have keeps their id, XP
   only ever goes up, and badges are merged. Somebody pasting a friend's code
   should never lose their own evening. */
function applyCode(obj) {
  if (!obj) return null;
  let added = 0, kept = 0;
  (obj.m || []).forEach(raw => {
    const m = normaliseMember(raw);
    state.custom = state.custom || [];
    const clash = state.custom.find(x => x.id === m.id);
    if (clash) { kept++; return; }
    if (SEED_MEMBERS.some(x => x.id === m.id)) { kept++; return; }
    state.custom.push(m); added++;
  });

  if (obj.k === 'progress') {
    state.xp = Math.max(state.xp || 0, obj.x || 0);
    state.unlocked = [...new Set([...(state.unlocked || []), ...(obj.u || [])])];
    state.visited = [...new Set([...(state.visited || []), ...(obj.v || [])])];
    state.played = [...new Set([...(state.played || []), ...(obj.pl || [])])];
    state.scores = [...(state.scores || []), ...(obj.s || [])]
      .sort((a, b) => b.score - a.score).slice(0, 60);
    Object.entries(obj.b || {}).forEach(([k, v]) => {
      state.beat = state.beat || {};
      if (!state.beat[k] || v.acc > state.beat[k].acc) state.beat[k] = v;
    });
  }
  rosterChanged();
  return { added, kept, kind: obj.k };
}

/* Clipboard access is refused in plenty of places — an iframe without
   permission, an insecure origin, a browser that just says no. Selecting the
   text is the fallback that always works. */
async function copyText(text, node) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch {
    if (node && node.select) { node.focus(); node.select(); }
    return false;
  }
}

    if (k === 'link') {

        + 'their own copy of the world, picks who they are, and keeps their own XP.'));
      const steps = el('div'); steps.style.marginTop = '14px';
      [
        'Share this page from the button in the corner of the Claude window, then send that link to the group.',
        'They open it on a phone or a laptop. Nothing to install, no account, no sign-in.',
        'They pick a member from the list. Two people can pick Juman — each copy of the world is their own.',
        'If you built the society here, send them the society code on the next tab so their campus has everybody on it.',
      ].forEach((txt, i) => {
        const st = el('div', 'step');
        st.append(el('b', '', String(i + 1)), el('p', '', txt));
        steps.appendChild(st);
      });
      body.appendChild(steps);
      body.appendChild(el('p', 'foot', 'Scores and XP live in each person’s own browser. '
        + 'There is no server, so nothing is collected about anybody.'));
      return;
    }

    const isSociety = k === 'society';
    body.appendChild(el('p', 'body', isSociety
      ? 'A code containing every member you added here — no scores, nobody’s progress. '
        + 'Send it to the society and they paste it in on their own copy.'
      : 'A code containing your XP, badges and best scores, plus any members you added. '
        + 'Use it to move to another device.'));

    const custom = (state.custom || []).length;
    if (isSociety && !custom) {
      body.appendChild(el('p', 'foot', 'You have not added anyone yet — open Society and add a '
        + 'member first, then this code will have something to carry.'));
    }

    const code = isSociety ? societyCode() : progressCode();
    const box = el('textarea', 'code'); box.value = code; box.readOnly = true;
    box.dataset.rv = 'code-out';
    box.onkeydown = e => e.stopPropagation();
    box.style.marginTop = '14px';
    body.appendChild(box);

    const row = el('div'); row.style.cssText = 'display:flex;gap:8px;margin-top:10px;flex-wrap:wrap';
    const copy = el('button', 'btn', 'Copy the code');
    copy.onclick = async () => {
      const done = await copyText(code, box);
      copy.textContent = done ? 'Copied' : 'Selected — press Ctrl+C';
      setTimeout(() => copy.textContent = 'Copy the code', 2200);
    };
    row.appendChild(copy);
    body.appendChild(row);

    body.appendChild(el('div', 'eyebrow', 'Paste a code in')).style.margin = '20px 0 8px';
    const inBox = el('textarea', 'code');
    inBox.placeholder = 'RESO1:…';
    inBox.dataset.rv = 'code-in';
    inBox.onkeydown = e => e.stopPropagation();
    body.appendChild(inBox);
    const load = el('button', 'btn ghost', 'Load it');
    load.dataset.rv = 'code-load';
    load.style.marginTop = '10px';
    const note = el('p', 'foot', '');
    load.onclick = () => {
      const parsed = readCode(inBox.value);
      if (!parsed) { note.textContent = 'That does not look like a Resoverse code. '
        + 'It should start with RESO1: and be pasted whole.'; sfx.deny(); return; }
      const res = applyCode(parsed);
      note.textContent = res.added
        ? res.added + ' member' + (res.added === 1 ? '' : 's') + ' joined the campus'
          + (res.kept ? ', ' + res.kept + ' already here' : '') + '.'
        : 'Loaded. Everybody in that code was already on your campus.';
      if (res.kind === 'progress') note.textContent += ' Progress merged — you keep the higher of the two.';
      inBox.value = '';
      sfx.levelUp();
      refreshQuests();
      openPanel('share');
    };
    body.append(load, note);
  });
};

];

const myLevel = () => levelOf(myXp()).level;

const nextUnlock = () => UNLOCKS.filter(u => !isUnlocked(u)).sort((a, b) => a.level - b.level)[0];

   the member's own appearance so the underlying character file is never
   edited by playing — somebody else's David is still David. */
function gearedLook(member) {

  look.gear = {

    jacket: eq.jacket && isUnlocked(UNLOCKS.find(u => u.id === eq.jacket) || { level: 99 }) ? eq.jacket : '',
    finish: eq.finish && isUnlocked(UNLOCKS.find(u => u.id === eq.finish) || { level: 99 }) ? eq.finish : '',
