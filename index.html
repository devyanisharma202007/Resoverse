<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#0b0819">
<title>Resoverse Campus</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,600;0,800;1,800&family=Familjen+Grotesk:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap">

<style>
/*
 * RESOVERSE — the campus, as one page.
 *
 * Committed to a single dark look. This is an evening campus; a light mode
 * would be a different product. Every colour is painted explicitly so the page
 * holds whatever ground it is dropped onto.
 */
:root {
  --void:#0b0819; --abyss:#120e2c; --surface:#1a1540; --line:#3a2f6e;
  --ink:#efe9ff; --dim:#9d95c4; --faint:#6f679a;
  --violet:#8b5cf6; --cyan:#22d3ee; --pink:#ec4899; --amber:#fbbf24; --teal:#5eead4;
  --display:'Archivo',system-ui,sans-serif;
  --body:'Familjen Grotesk',system-ui,sans-serif;
  --mono:'DM Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--void);color:var(--ink);font-family:var(--body);overflow:hidden;
  -webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
button,input{font-family:inherit}
kbd{font-family:var(--mono);font-size:10px;padding:2px 6px;border-radius:5px;
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18)}

#stage{position:fixed;inset:0}
#world{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;touch-action:none}

.hud{position:fixed;inset:0;z-index:10;pointer-events:none}
.hud button,.hud input,.card,nav,.chat,.events{pointer-events:auto}

.card{background:rgba(16,12,36,.88);border:1px solid rgba(139,92,246,.34);border-radius:14px;
  backdrop-filter:blur(6px);box-shadow:0 8px 26px rgba(0,0,0,.45)}
.eyebrow{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}

/* top left */
.tl{position:absolute;left:max(14px,env(safe-area-inset-left));top:max(12px,env(safe-area-inset-top));display:flex;flex-direction:column;gap:10px;max-width:250px}
.wordmark{display:block;font-family:var(--display);font-weight:800;font-style:italic;font-size:26px;
  letter-spacing:-.015em;line-height:1;background:linear-gradient(92deg,#fff,#cbb8ff);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  text-shadow:0 2px 18px rgba(139,92,246,.5)}
.tagline{display:block;margin-top:3px;font-size:10.5px;font-style:italic;color:var(--dim)}
.me{display:flex;align-items:center;gap:11px;padding:9px 13px 9px 9px}
.portrait{width:46px;height:46px;flex:0 0 46px;border-radius:12px;overflow:hidden;display:grid;
  place-items:center;background:linear-gradient(160deg,#2b2450,#1a1436);border:1px solid rgba(139,92,246,.5)}
.pname{font-size:15px;font-weight:600;display:flex;align-items:center;gap:6px}
.crown{color:var(--amber);font-size:11px}
.lvl{display:flex;align-items:baseline;gap:8px;font-size:11.5px;color:#c9c0ea;margin-top:1px}
.lvl em{color:var(--faint);font-size:10.5px;font-style:normal;font-variant-numeric:tabular-nums}
.meter{margin-top:5px;height:5px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden}
.meter i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--violet),var(--pink));
  transition:width .4s ease-out}
nav{display:flex;flex-direction:column;gap:3px}
.navitem{display:flex;align-items:center;gap:10px;padding:7px 11px;border:1px solid transparent;
  border-radius:10px;background:none;color:#cfc6ee;font-size:13.5px;cursor:pointer;text-align:left;
  transition:background .15s,border-color .15s,color .15s}
.navitem:hover{background:rgba(139,92,246,.16);color:#fff}
.navitem.on{background:rgba(139,92,246,.24);border-color:rgba(139,92,246,.5);color:#fff}
.navitem b{width:22px;height:22px;display:grid;place-items:center;border-radius:7px;
  background:rgba(16,12,36,.8);border:1px solid rgba(139,92,246,.3);font-size:11px;font-weight:400}

/* top right */
.tr{position:absolute;right:max(14px,env(safe-area-inset-right));top:max(12px,env(safe-area-inset-top));display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.clock{display:flex;align-items:center;gap:11px;padding:8px 15px}
.clock .sun{font-size:16px;color:var(--amber)}
.clock .phase{font-size:13.5px;font-weight:600}
.clock .t{font-family:var(--mono);font-size:15px;color:#c9c0ea;font-variant-numeric:tabular-nums}
.minimap{position:relative;width:124px;height:124px;border-radius:50%;display:grid;place-items:center;
  background:rgba(16,12,36,.92);border:2px solid rgba(251,191,36,.55);box-shadow:0 8px 26px rgba(0,0,0,.5);
  pointer-events:auto}
.minimap canvas{border-radius:50%;image-rendering:pixelated}
.minimap span{position:absolute;top:-1px;font-family:var(--mono);font-size:9px;color:var(--amber)}
.where{display:flex;align-items:center;gap:10px;padding:8px 14px}
.where .pin{color:var(--pink);font-size:12px}
.where .place{font-size:13px;font-weight:600}

/* events rail */
.events{position:absolute;right:14px;top:274px;width:174px;display:flex;flex-direction:column;gap:8px}
.event{padding:11px 13px;border-left-width:3px}
.event h4{font-family:var(--display);font-weight:800;font-size:15px;margin:3px 0 0;text-wrap:balance}
.event .when{font-family:var(--mono);font-size:10px;color:#c9c0ea;margin-top:4px}
.event .where2{font-size:11px;color:var(--faint)}
.viewall{align-self:flex-end;background:none;border:none;color:var(--dim);font-size:11px;
  letter-spacing:.08em;text-transform:uppercase;cursor:pointer;padding:2px}
.viewall:hover{color:#fff}

/* chat */
.chat{position:absolute;left:max(14px,env(safe-area-inset-left));bottom:calc(14px + env(safe-area-inset-bottom));width:296px;max-width:calc(100vw - 28px);
  background:rgba(11,8,25,.92);border:1px solid rgba(139,92,246,.28);border-radius:14px;
  overflow:hidden;backdrop-filter:blur(6px)}
.chat.min{width:172px}
.chat .tabs{display:flex;align-items:center;gap:2px;padding:6px 6px 0;border-bottom:1px solid rgba(139,92,246,.2)}
.chat .tabs button{background:none;border:none;border-bottom:2px solid transparent;color:var(--faint);
  font-size:12px;padding:6px 10px;cursor:pointer}
.chat .tabs button.on{color:#fff;border-bottom-color:var(--violet)}
.chat .tabs .min{margin-left:auto;font-size:15px;line-height:1}
.chat .list{height:128px;overflow-y:auto;padding:8px 12px;font-size:12.5px;line-height:1.65;scrollbar-width:thin}
.chat .list div{color:#d8d1f0;word-break:break-word}
.chat .list b{font-weight:600}
.chat form{display:flex;gap:6px;padding:8px;border-top:1px solid rgba(139,92,246,.2)}
.chat input{flex:1;min-width:0;background:rgba(139,92,246,.12);border:1px solid rgba(139,92,246,.28);
  border-radius:999px;padding:7px 13px;color:var(--ink);font-size:12.5px}
.chat input:focus{outline:2px solid rgba(139,92,246,.55);outline-offset:1px}
.chat form button{background:none;border:none;color:var(--violet);font-size:15px;cursor:pointer;padding:0 6px}

/* action bar */
.barwrap{position:absolute;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;
  flex-direction:column;align-items:center;gap:8px}
.actions{display:flex;gap:2px;padding:7px 10px;background:rgba(11,8,25,.92);
  border:1px solid rgba(139,92,246,.3);border-radius:16px;backdrop-filter:blur(6px);
  box-shadow:0 8px 26px rgba(0,0,0,.5)}
.actions button{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:62px;
  padding:5px 8px;background:none;border:none;border-radius:11px;color:#cfc6ee;cursor:pointer;
  transition:background .14s,color .14s}
.actions button:hover{background:rgba(139,92,246,.2);color:#fff}
.actions i{font-size:17px;line-height:1;font-style:normal}
.actions span{font-size:10.5px}
.emotes{display:flex;gap:5px;padding:6px;background:rgba(11,8,25,.94);
  border:1px solid rgba(139,92,246,.35);border-radius:12px}
.emotes button{background:rgba(139,92,246,.16);border:1px solid rgba(139,92,246,.3);border-radius:999px;
  color:var(--ink);font-size:11.5px;padding:5px 12px;cursor:pointer;text-transform:capitalize}
.emotes button:hover{background:rgba(139,92,246,.36)}

/* prompt + toast + quest tracker */
.prompt{position:absolute;left:50%;bottom:96px;transform:translateX(-50%);display:flex;align-items:center;
  gap:9px;padding:8px 15px;background:rgba(11,8,25,.94);border:1px solid var(--violet);border-radius:999px;
  font-size:13px;white-space:nowrap;animation:rise .18s ease-out}
.toast{position:absolute;left:50%;top:38%;transform:translateX(-50%);padding:10px 20px;
  background:rgba(11,8,25,.94);border:1px solid rgba(251,191,36,.5);border-radius:999px;font-size:14px;
  animation:rise .22s ease-out;white-space:nowrap}
.tracker{position:absolute;right:14px;bottom:14px;display:flex;align-items:center;gap:11px;padding:9px 15px}
.tracker .star{font-size:17px;color:var(--amber)}
.tracker .txt{font-size:12.5px}
.tracker .meter{width:120px;margin-top:4px}
@keyframes rise{from{opacity:0;transform:translateX(-50%) translateY(6px)}to{opacity:1;transform:translateX(-50%)}}

/* panels */
.modal{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:20px;
  background:rgba(6,4,16,.74);backdrop-filter:blur(5px);pointer-events:auto;animation:fade .16s ease-out}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{position:relative;width:100%;max-width:520px;max-height:82vh;overflow-y:auto;padding:26px;
  background:linear-gradient(168deg,#1a1540,#120e2c);border:1px solid rgba(139,92,246,.4);
  border-radius:18px;box-shadow:0 24px 70px rgba(0,0,0,.6)}
.close{position:absolute;right:14px;top:14px;width:30px;height:30px;border-radius:9px;
  background:rgba(139,92,246,.16);border:1px solid rgba(139,92,246,.3);color:#cfc6ee;cursor:pointer;font-size:13px}
.close:hover{background:rgba(139,92,246,.36);color:#fff}
h2{font-family:var(--display);font-weight:800;font-size:22px;margin:0 0 12px;letter-spacing:-.01em}
p.body{font-size:14px;color:#c9c0ea;line-height:1.65;margin:0;max-width:60ch}
.foot{font-size:11.5px;color:var(--faint);margin-top:12px}
.tabs2{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tabs2 button{background:rgba(139,92,246,.12);border:1px solid rgba(139,92,246,.26);border-radius:999px;
  color:#c9c0ea;font-size:12px;padding:5px 13px;cursor:pointer}
.tabs2 button.on{background:rgba(139,92,246,.4);color:#fff}
.rows{display:flex;flex-direction:column;gap:4px}
.row{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:11px;background:rgba(139,92,246,.08)}
.row .rank{width:22px;text-align:center;font-size:14px}
.row .face{width:32px;height:32px;flex:0 0 32px;border-radius:9px;overflow:hidden;display:grid;
  place-items:center;background:rgba(16,12,36,.7)}
.row b{display:block;font-size:13.5px}
.row em{display:block;font-size:11.5px;color:var(--faint);font-style:normal}
.row .score{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--amber)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:11.5px;padding:5px 12px;border-radius:999px;border:1px solid rgba(139,92,246,.22);
  color:var(--faint);opacity:.6;background:rgba(139,92,246,.08);font-family:var(--body);line-height:1.3}
.chip.on{opacity:1;color:var(--ink);border-color:rgba(139,92,246,.55);background:rgba(139,92,246,.26)}
button.chip{cursor:pointer}
button.chip:hover{background:rgba(139,92,246,.42);color:#fff}
.btn{background:linear-gradient(92deg,var(--violet),var(--pink));border:none;border-radius:999px;color:#fff;
  font-size:14px;font-weight:600;padding:11px 22px;cursor:pointer}
.btn.ghost{background:rgba(139,92,246,.16);border:1px solid rgba(139,92,246,.34)}
.phead{display:flex;gap:16px;align-items:flex-start;margin-bottom:14px}
.pbig{flex:0 0 auto;border-radius:14px;overflow:hidden;padding:4px;
  background:linear-gradient(160deg,#2b2450,#1a1436);border:1px solid rgba(139,92,246,.4)}
.role{font-size:12.5px;color:var(--dim);text-transform:capitalize}
.quote{font-size:13.5px;font-style:italic;color:#c9c0ea;margin:8px 0 0}

/* games live full-screen over everything */
.gamewrap{position:fixed;inset:0;z-index:40;background:var(--void);pointer-events:auto;display:flex;flex-direction:column}
.gtop{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;
  border-bottom:1px solid rgba(139,92,246,.24);flex-wrap:wrap}
.gtitle{font-family:var(--display);font-weight:800;font-style:italic;font-size:19px;
  background:linear-gradient(92deg,var(--amber),var(--pink));-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent}
.gbody{flex:1;overflow:auto;padding:16px;display:flex;gap:18px;justify-content:center;flex-wrap:wrap;align-content:flex-start}

/* reso rush */
.board{display:grid;gap:4px;padding:10px;border-radius:16px;background:rgba(16,12,36,.8);
  border:1px solid rgba(139,92,246,.3)}
.cell{width:44px;height:44px;border-radius:10px;border:1px solid rgba(255,255,255,.08);cursor:pointer;
  display:grid;place-items:center;font-size:19px;transition:transform .12s,box-shadow .12s;padding:0;color:#fff}
.cell:hover{transform:scale(1.06)}
.cell.sel{outline:2px solid var(--amber);outline-offset:1px;transform:scale(1.1)}
.cell.pop{animation:pop .22s ease-out}
@keyframes pop{0%{transform:scale(1)}55%{transform:scale(1.35);filter:brightness(1.7)}100%{transform:scale(0)}}
.stats{display:flex;flex-direction:column;gap:10px;min-width:170px}
.stat{padding:11px 14px;border-radius:12px;background:rgba(139,92,246,.1)}
.stat .n{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.combo{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);font-family:var(--display);
  font-weight:800;font-style:italic;font-size:44px;color:#fff;pointer-events:none;
  text-shadow:0 0 24px rgba(236,72,153,.95),0 0 60px rgba(34,211,238,.7);animation:combo .9s ease-out forwards}
@keyframes combo{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}
  30%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-90%) scale(1)}}

/* reso ludo */
.ludo{position:relative;width:min(74vh,440px);aspect-ratio:1;border-radius:16px;
  background:linear-gradient(160deg,#1a1538,#120e28);border:1px solid rgba(139,92,246,.3)}
.lsq{position:absolute;border-radius:4px}
.lpiece{position:absolute;border-radius:50%;border:2px solid rgba(255,255,255,.75);cursor:default;
  transition:left .3s ease-out,top .3s ease-out;padding:0}
.lpiece.can{cursor:pointer;box-shadow:0 0 0 3px rgba(255,255,255,.35),0 0 14px currentColor;
  animation:bob .9s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-14%)}}
.die{width:54px;height:54px;border-radius:13px;background:linear-gradient(150deg,#efe7dc,#cfc4bb);
  position:relative;border:2px solid rgba(251,191,36,.7)}
.die i{position:absolute;width:9px;height:9px;border-radius:50%;background:#221c3d;transform:translate(-50%,-50%)}
.die.roll{animation:tumble .42s ease-out}
@keyframes tumble{0%{transform:rotate(0) scale(1)}40%{transform:rotate(-160deg) scale(1.12)}
  100%{transform:rotate(-360deg) scale(1)}}

/* touch */
.stick{position:fixed;width:104px;height:104px;margin:-52px 0 0 -52px;border-radius:50%;
  border:1.5px solid rgba(255,255,255,.22);background:rgba(12,10,28,.28);opacity:0;
  transition:opacity .14s;pointer-events:none;z-index:30}
.stick i{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;
  background:rgba(139,92,246,.6);border:1.5px solid rgba(255,255,255,.5);box-shadow:0 0 18px rgba(139,92,246,.8)}

/* ── phones ──────────────────────────────────────────────────────
   A phone is not a small laptop. The interface that reads as rich on a
   1360px screen covers two thirds of a 390px one, and what the player
   actually wants back is the world. So on a phone the panels collapse
   behind one button, the chat is a sheet you open, and the identity
   card becomes a strip. Everything is still there; almost none of it is
   in the way.
   ────────────────────────────────────────────────────────────── */
@media (max-width:700px){
  .events{display:none}
  .where{display:none}
  nav{display:none}                 /* the panels live behind Menu instead */
  .tagline{display:none}

  .tl{gap:6px;max-width:none;right:auto}
  .wordmark{font-size:15px;letter-spacing:0;opacity:.75}
  .me{padding:5px 11px 5px 5px;gap:8px;border-radius:12px}
  .portrait{width:32px;height:32px;flex:0 0 32px;border-radius:9px}
  .pname{font-size:12.5px;gap:4px}
  .lvl{font-size:10px;margin-top:0}
  .lvl em{font-size:9.5px}
  .meter{height:3px;margin-top:3px}

  .tr{gap:6px}
  .clock{padding:5px 10px;gap:7px}
  .clock .sun{font-size:12px}
  .clock .phase{display:none}
  .clock .t{font-size:12px}
  .minimap{width:62px;height:62px;border-width:1.5px}
  .minimap span{display:none}
  .who{padding:5px 10px}
  .who b{font-size:10.5px}

  /* the chat is a sheet, and it is shut until you ask for it */
  .chat{width:calc(100vw - 20px);left:10px;bottom:calc(74px + env(safe-area-inset-bottom));
    border-radius:16px}
  .chat.min{display:none}
  .chat .list{height:33vh}
  .chat .tabs button{padding:8px 13px;font-size:13px}
  .chat input{font-size:16px;padding:9px 14px}   /* 16px or iOS zooms the page */

  .tracker{display:none}            /* it lives in Quests */

  .barwrap{left:0;right:0;transform:none;align-items:stretch;padding:0 8px}
  .actions{border-radius:18px;padding:6px;gap:2px;justify-content:space-between}
  .actions button{flex:1;min-width:0;min-height:52px;padding:6px 2px;gap:2px}
  .actions i{font-size:21px}
  .actions span{font-size:9.5px;letter-spacing:.01em}
  .actions button.primary{background:linear-gradient(150deg,rgba(251,191,36,.34),rgba(236,72,153,.3));
    border:1px solid rgba(251,191,36,.5)}
  .emotes{flex-wrap:wrap;justify-content:center;margin:0 8px}
  .emotes button{font-size:13px;padding:8px 15px}

  .prompt{bottom:calc(84px + env(safe-area-inset-bottom));font-size:14px;padding:10px 18px;
    max-width:calc(100vw - 24px)}
  .toast{top:auto;bottom:calc(150px + env(safe-area-inset-bottom));font-size:13px;
    max-width:calc(100vw - 32px);white-space:normal;text-align:center}

  .sheet{padding:18px 16px;max-height:88vh;border-radius:20px}
  .modal{padding:10px}
  h2{font-size:19px}
  .tabs2 button{padding:8px 14px;font-size:13px}
  .row{padding:11px}
  .btn{padding:13px 20px}
  .field input,.field textarea,.field select{font-size:16px}

  /* the menu of panels */
  .menugrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
  .menutile{display:flex;flex-direction:column;align-items:center;gap:6px;padding:15px 8px;
    border-radius:15px;background:rgba(139,92,246,.1);border:1px solid rgba(139,92,246,.26);
    color:var(--ink);font-size:12px;cursor:pointer}
  .menutile i{font-size:23px;font-style:normal;line-height:1}

  /* games */
  .gtop{padding:9px 11px}
  .gtitle{font-size:16px}
  .gbody{padding:10px;gap:12px;flex-direction:column;align-items:stretch}
  .stats{min-width:0;flex-direction:row;flex-wrap:wrap}
  .stat{flex:1;min-width:88px;padding:8px 11px}
  .stat .n{font-size:18px}
  .cell{width:min(10.5vw,40px);height:min(10.5vw,40px);font-size:15px}
  .board{gap:3px;padding:7px;margin:0 auto}
  .ludo{width:min(94vw,420px)}
  .beat{width:100%}
  .pads{height:82px}

  /* the jam room, for thumbs */
  .jam{width:100%}
  .jamtop{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
  .jamtop::-webkit-scrollbar{display:none}
  .inst{min-width:62px;flex:0 0 auto;padding:8px 8px}
  .rack{padding:9px;min-height:0}
  .keys{height:132px}
  .bkeys{height:80px}
  .wkey{font-size:9px}
  .strng > b{width:16px;font-size:9px}
  .strng{gap:4px}
  .fret{height:46px;font-size:12px;border-radius:9px}
  .chords{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
  .chords::-webkit-scrollbar{display:none}

<div id="stage">
  <canvas id="world"></canvas>
</div>
<div class="stick" id="stick"><i></i></div>
<div class="hud" id="hud"></div>
<div id="overlay"></div>

<script>
/* ════════════════════════════════════════════════════════════════
   RESOVERSE — one file, no build step, no install.
   Everything you see is drawn by code: no image files, no tileset,
   no sprite sheets to buy or license. A member is a data object and
   the renderer turns them into an animated character.
   ════════════════════════════════════════════════════════════════ */

/* ── pixel helpers ───────────────────────────────────────────── */

const hex2rgb = h => { h = h.replace('#',''); if (h.length===3) h = h.split('').map(c=>c+c).join('');
  return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)]; };
const clamp255 = n => Math.max(0, Math.min(255, Math.round(n)));
const rgb2hex = (r,g,b) => '#' + [r,g,b].map(c => clamp255(c).toString(16).padStart(2,'0')).join('');

/* Lighten or darken. Shadows lean violet so they belong to this palette
   instead of going muddy grey. */
function shade(hex, t) {
  const [r,g,b] = hex2rgb(hex);
  if (t >= 0) return rgb2hex(r+(255-r)*t, g+(255-g)*t, b+(255-b)*t);
  const k = 1 + t;
  return rgb2hex(r*k + 18*-t, g*k + 8*-t, b*k + 34*-t);
}
const ramp = h => ({ lit: shade(h,.24), base: h, shadow: shade(h,-.26), line: shade(h,-.52) });

function pxOn(ctx) {
  const rect = (x,y,w,h,c) => { if (w<=0||h<=0) return; ctx.fillStyle=c;
    ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h)); };
  const oval = (cx,cy,rx,ry,c) => { if (rx<=0||ry<=0) return; ctx.fillStyle=c;
    for (let y=-ry;y<=ry;y++){ const w=Math.floor(rx*Math.sqrt(Math.max(0,1-(y*y)/(ry*ry)))+.5);
      if (w>0) ctx.fillRect(Math.round(cx-w),Math.round(cy+y),w*2,1); } };
  return {
    rect, oval,
    dot: (x,y,c) => rect(x,y,1,1,c),
    row: (x,y,w,c) => rect(x,y,w,1,c),
    col: (x,y,h,c) => rect(x,y,1,h,c),
    round: (x,y,w,h,c,r=1) => { rect(x+r,y,w-r*2,h,c); rect(x,y+r,r,h-r*2,c); rect(x+w-r,y+r,r,h-r*2,c); },
    line: (x0,y0,x1,y1,c) => { let x=Math.round(x0), y=Math.round(y0);
      const ex=Math.round(x1), ey=Math.round(y1);
      const dx=Math.abs(ex-x), dy=-Math.abs(ey-y), sx=x<ex?1:-1, sy=y<ey?1:-1;
      let err=dx+dy; ctx.fillStyle=c;
      for (let g=0; g<2048; g++) { ctx.fillRect(x,y,1,1); if (x===ex&&y===ey) break;
        const e2=err*2; if (e2>=dy){err+=dy;x+=sx;} if (e2<=dx){err+=dx;y+=sy;} } },
    diamond: (cx,cy,w,h,c) => { ctx.fillStyle=c; const hw=w/2, hh=h/2;
      for (let y=0;y<h;y++){ const t=1-Math.abs((y+.5-hh)/hh); const half=Math.max(1,Math.round(hw*t));
        ctx.fillRect(Math.round(cx-half), Math.round(cy-hh+y), half*2, 1); } },
  };
}

function surface(w,h) { const c = document.createElement('canvas'); c.width=w; c.height=h;
  const ctx = c.getContext('2d'); ctx.imageSmoothingEnabled = false; return {canvas:c, ctx, p:pxOn(ctx)}; }

/* ── the character sprite ────────────────────────────────────────
   One function paints any member in any pose. This is why a
   fortieth member costs the same as a fourth.
   ────────────────────────────────────────────────────────────── */

const SW = 32, SH = 44, FOOT = 43;
const G = { cx:16, headTop:3, headH:14, headHalf:7, headHalfSide:6, neckY:16, torsoY:17,
  torsoH:14, torsoHalf:7, torsoHalfSide:5, legY:31, legH:9, legW:5, shoeH:3, armY:18, armH:13, armW:3 };
const EYE = G.headTop + 7;

const POSES = ['idle','walk','play','wave','clap','sit','jump','cheer'];
const FRAMES = { idle:4, walk:4, play:4, wave:4, clap:4, sit:2, jump:2, cheer:4 };
const DIRS = ['S','N','E'];
const ROLE_INSTRUMENT = { vocalist:'mic', guitarist:'guitar', bassist:'bass', drummer:'drums',
  keyboardist:'keys', saxophonist:'sax', producer:'keys', core:'mic', member:'guitar' };

function hairBack(p,a,dir,dy){ const r=ramp(a.hair.color);
  const half = dir==='E'?G.headHalfSide:G.headHalf, x=G.cx-half, w=half*2, top=G.headTop+dy;
  if (a.hair.style==='long-straight'){ p.rect(x-2,top+2,w+4,22,r.shadow); p.rect(x-2,top+2,2,22,r.base); p.rect(x+w,top+2,2,22,r.base); }
  else if (a.hair.style==='wavy-mid'){ p.rect(x-2,top+3,w+4,13,r.shadow); p.rect(x-2,top+13,3,3,r.base); p.rect(x+w-1,top+15,3,3,r.base); }
  else if (a.hair.style==='curly-volume'){ p.oval(G.cx,top+4,half+3,7,r.shadow); } }

function hairFront(p,a,dir,dy){ const r=ramp(a.hair.color);
  const half = dir==='E'?G.headHalfSide:G.headHalf, x=G.cx-half, w=half*2, top=G.headTop+dy;
  if (dir==='N'){ // facing away: the whole head is hair
    p.rect(x-1,top-1,w+2,G.headH,r.base); p.rect(x-1,top-1,w+2,2,r.lit);
    p.rect(x,top+G.headH-4,w,3,r.shadow);
    if (a.hair.style==='long-straight'||a.hair.style==='wavy-mid'){
      p.rect(x-2,top+2,w+4,G.headH+4,r.base); p.rect(G.cx-1,top+2,2,G.headH,r.shadow); }
    return; }
  switch(a.hair.style){
    case 'curly-volume':
      p.oval(G.cx,top+2,half+1,4,r.base); p.oval(G.cx-half,top+3,2,2,r.base); p.oval(G.cx+half,top+3,2,2,r.base);
      p.oval(G.cx-3,top,2,2,r.lit); p.oval(G.cx+3,top+1,2,2,r.base); p.rect(x,top+2,w,2,r.base);
      p.rect(x,top+4,1,3,r.shadow); p.rect(x+w-1,top+4,1,3,r.shadow); break;
    case 'bowl-fringe':
      p.rect(x-1,top,w+2,5,r.base); p.rect(x-1,top,w+2,2,r.lit);
      p.rect(x-1,top+5,w+2,1,r.shadow); p.rect(x+1,top+6,4,1,r.shadow); break;
    case 'short-crop':
      p.rect(x,top+1,w,4,r.base); p.rect(x,top+1,w,1,r.lit);
      p.rect(x-1,top+2,1,3,r.shadow); p.rect(x+w,top+2,1,3,r.shadow); break;
    case 'long-straight':
      p.rect(x-1,top,w+2,5,r.base); p.rect(x-1,top,w+2,2,r.lit);
      p.rect(x-2,top+4,2,12,r.base); p.rect(x+w,top+4,2,12,r.base); break;
    default:
      p.rect(x-1,top,w+2,5,r.base); p.rect(x-1,top,w+2,2,r.lit);
      p.rect(x-2,top+4,2,7,r.base); p.rect(x+w,top+4,2,7,r.base);
      p.rect(G.cx-1,top,2,3,r.shadow); }
}

function face(p,a,dir,o,dy){ if (dir==='N') return;
  const y = EYE+dy, ink='#241c3a', blush=shade(a.skinTone,-.18);
  const singing = o.pose==='play' && o.instrument==='mic';
  const happy = o.pose==='cheer'||o.pose==='wave'||o.pose==='clap';
  if (dir==='S'){
    const blink = o.pose==='idle' && o.frame===3;
    if (blink){ p.rect(G.cx-5,y+1,3,1,ink); p.rect(G.cx+2,y+1,3,1,ink); }
    else { p.rect(G.cx-5,y,2,3,ink); p.rect(G.cx+3,y,2,3,ink);
      p.dot(G.cx-5,y,'#fff'); p.dot(G.cx+3,y,'#fff'); }
    p.dot(G.cx-7,y+3,blush); p.dot(G.cx+6,y+3,blush);
    if (singing){ p.rect(G.cx-1,y+5,3,3,ink); p.dot(G.cx,y+6,'#c2607a'); }
    else if (happy){ p.rect(G.cx-2,y+5,4,1,ink); p.dot(G.cx-2,y+4,ink); p.dot(G.cx+1,y+4,ink); }
    else p.rect(G.cx-1,y+5,2,1,ink);
  } else {
    p.rect(G.cx+2,y,2,3,ink); p.dot(G.cx+2,y,'#fff');
    p.dot(G.cx+5,y+2,shade(a.skinTone,-.22)); p.rect(G.cx+1,y+5,2,1,ink); }
}

function torsoOf(p,a,dir,bob){ const r=ramp(a.outfit.primary), acc=ramp(a.outfit.accent);
  const half = dir==='E'?G.torsoHalfSide:G.torsoHalf, x=G.cx-half, w=half*2, y=G.torsoY+bob;
  p.rect(x-1,y,w+2,G.torsoH,r.line); p.rect(x,y-1,w,G.torsoH+2,r.line);
  p.rect(x,y,w,G.torsoH,r.base); p.rect(x,y,Math.max(1,Math.floor(w/3)),G.torsoH,r.lit);
  p.rect(x,y+G.torsoH-1,w,1,r.shadow);
  switch(a.outfit.style){
    case 'hoodie-zip': p.rect(x-1,y-1,w+2,3,r.shadow);
      if (dir!=='N') p.col(G.cx,y+2,G.torsoH-3,acc.base);
      p.rect(x,y+G.torsoH-3,w,2,r.shadow); break;
    case 'shirt-tie': if (dir==='S'){ p.dot(G.cx-2,y+1,r.lit); p.dot(G.cx+1,y+1,r.lit);
      p.rect(G.cx-1,y+2,2,6,acc.base); p.rect(G.cx-1,y+8,2,2,acc.shadow); } break;
    case 'jacket-open': if (dir!=='N'){ p.rect(G.cx-2,y+1,4,G.torsoH-2,ramp(a.outfit.secondary).lit);
      p.col(G.cx-3,y+1,G.torsoH-2,r.shadow); p.col(G.cx+2,y+1,G.torsoH-2,r.shadow); } break;
    default: p.rect(x,y,w,2,r.lit); }
  if (a.outfit.pattern==='stripes'){ const pc=a.outfit.patternColor||a.outfit.accent;
    for (let i=3;i<G.torsoH-2;i+=3) p.rect(x,y+i,w,1,pc); }
}

function armsOf(p,a,dir,o,bob){ const r=ramp(a.outfit.primary), skin=ramp(a.skinTone);
  const half = dir==='E'?G.torsoHalfSide:G.torsoHalf, y=G.armY+bob;
  let l=0, rr=0;
  if (o.pose==='walk'){ const s=[0,2,0,-2][o.frame%4]; l=s; rr=-s; }
  else if (o.pose==='wave'){ rr=[7,9,7,9][o.frame%4]; }
  else if (o.pose==='clap'||o.pose==='cheer'){ const s=[4,6,4,6][o.frame%4]; l=s; rr=s; }
  else if (o.pose==='jump'){ l=rr=8; }
  else if (o.pose==='idle'){ const s=[0,0,1,0][o.frame%4]; l=s; rr=s; }
  const arm = (x,lift) => { const top=y-lift;
    p.rect(x-1,top-1,G.armW+2,G.armH+2,r.line);
    p.rect(x,top,G.armW,G.armH-3,r.base);
    p.rect(x,top+G.armH-3,G.armW,3,skin.base); };
  if (dir==='E'){ p.rect(G.cx-half-1,y+1,G.armW,G.armH-2,r.shadow); arm(G.cx+half-1,rr); }
  else { arm(G.cx-half-G.armW,l); arm(G.cx+half,rr); }
}

function legsOf(p,a,dir,o){ const r=ramp(a.outfit.secondary), sh=ramp(a.shoes.primary);
  let a1=0,a2=0;
  if (o.pose==='walk'){ a1=[0,-2,0,2][o.frame%4]; a2=-a1; }
  else if (o.pose==='jump'){ a1=a2=-2; }
  const leg = (x,off) => { const h=G.legH-Math.abs(off)/2;
    p.rect(x-1,G.legY,G.legW+2,h+1,r.line); p.rect(x,G.legY,G.legW,h,r.base); p.rect(x,G.legY,1,h,r.lit);
    const sy=G.legY+h, w = a.shoes.style==='boots' ? G.legW+1 : G.legW;
    p.rect(x-1,sy-1,w+2,G.shoeH+1,sh.line); p.rect(x,sy,w,G.shoeH-1,sh.base);
    p.rect(x,sy+G.shoeH-2,w,1,ramp(a.shoes.accent).base);
    if (a.shoes.style==='sneakers-hi') p.rect(x,sy-2,G.legW-1,2,sh.lit); };
  if (dir==='E'){ leg(G.cx-3+a1,a1); leg(G.cx-1+a2,a2); }
  else { leg(G.cx-G.legW-1,a1); leg(G.cx+2,a2); }
}

function accessoriesOf(p,a,dir,dy){ const half = dir==='E'?G.headHalfSide:G.headHalf;
  const set = new Set(a.accessories||[]);
  const headTop=G.headTop+dy, neckY=G.neckY+dy, torsoY=G.torsoY+dy, y=EYE+dy;
  if (set.has('backpack')){ const r=ramp(shade(a.outfit.accent,-.2));
    if (dir==='N'){ p.rect(G.cx-5,torsoY+3,10,8,r.shadow); p.rect(G.cx-5,torsoY+3,10,1,r.base);
      p.rect(G.cx-2,torsoY+6,4,2,r.line); }
    else { p.rect(G.cx-G.torsoHalf+1,torsoY+1,2,8,r.base); p.rect(G.cx+G.torsoHalf-3,torsoY+1,2,8,r.base); } }
  if (set.has('scarf')){ const r=ramp(a.outfit.accent); p.rect(G.cx-half+1,neckY,half*2-2,3,r.base);
    if (dir!=='N') p.rect(G.cx+1,neckY+3,2,5,r.shadow); }
  if (set.has('lanyard') && dir!=='N'){ const r=ramp(a.outfit.accent);
    p.line(G.cx-4,torsoY,G.cx-1,torsoY+6,r.base); p.line(G.cx+3,torsoY,G.cx,torsoY+6,r.base);
    p.rect(G.cx-2,torsoY+6,4,3,'#e8e2d6'); }
  if (set.has('glasses') && dir!=='N'){ const ink='#2b2340';
    if (dir==='S'){ p.rect(G.cx-6,y-1,4,1,ink); p.rect(G.cx-6,y+2,4,1,ink);
      p.col(G.cx-6,y,2,ink); p.col(G.cx-3,y,2,ink);
      p.rect(G.cx+2,y-1,4,1,ink); p.rect(G.cx+2,y+2,4,1,ink);
      p.col(G.cx+2,y,2,ink); p.col(G.cx+5,y,2,ink); p.row(G.cx-2,y,4,ink);
      p.dot(G.cx-5,y,'#c9e6f2'); p.dot(G.cx+4,y+1,'#c9e6f2'); }
    else { p.rect(G.cx+1,y-1,5,1,ink); p.rect(G.cx+1,y+2,5,1,ink); p.col(G.cx+1,y,2,ink); p.col(G.cx+5,y,2,ink); } }
  if (set.has('headphones')){ const r=ramp(a.outfit.accent);
    p.rect(G.cx-half-1,headTop+4,3,7,r.base); p.rect(G.cx+half-1,headTop+4,3,7,r.base);
    p.line(G.cx-half,headTop+3,G.cx,headTop-1,r.shadow); p.line(G.cx,headTop-1,G.cx+half+1,headTop+3,r.shadow); }
  if (set.has('wristband')){ const r=ramp(a.outfit.accent);
    p.rect(G.cx-G.torsoHalf-G.armW,G.armY+G.armH-4+dy,G.armW,2,r.base); }
}

/* Instrument finishes. Earned, not bought — the level gate is the price. */
const FINISHES = {
  '':        { guitar:'#c0553a', bass:'#7b3f2a', keys:'#1d1a33', drums:'#c96a4a', mic:'#3a3452', sax:'#caa64a' },
  sunburst:  { guitar:'#d98324', bass:'#a35a1e', keys:'#3a2410', drums:'#d98324', mic:'#6b4418', sax:'#e0a53c' },
  midnight:  { guitar:'#2a2450', bass:'#1e1b3a', keys:'#12102a', drums:'#2f2a5c', mic:'#232049', sax:'#4a4480' },
  cherry:    { guitar:'#b01f3a', bass:'#8a1730', keys:'#2a0f1a', drums:'#c22a46', mic:'#7c1228', sax:'#d4425c' },
  seafoam:   { guitar:'#2f9c8a', bass:'#1f6f62', keys:'#0f2a28', drums:'#38b09c', mic:'#1c4c46', sax:'#5eead4' },
  gold:      { guitar:'#d4a02c', bass:'#a87d1c', keys:'#3a2e0c', drums:'#e0b040', mic:'#6b5310', sax:'#f5d34a' },
};
const finishOf = (a, inst) => (FINISHES[(a.gear||{}).finish] || FINISHES[''])[inst] || FINISHES[''][inst];

function instrumentOf(p,a,o,bob){ const inst=o.instrument;
  if (!inst || inst==='none' || o.pose!=='play') return;
  const y=G.torsoY+bob, strum=[0,1,0,-1][o.frame%4], skin=ramp(a.skinTone);
  if (inst==='guitar'||inst==='bass'){ const body=ramp(finishOf(a,inst)), neck=ramp('#5a3b28');
    p.oval(G.cx+3,y+9,7,6,body.base); p.oval(G.cx+2,y+8,2,2,body.line);
    p.rect(G.cx-11,y+2,12,2,neck.base); p.rect(G.cx-12,y+1,3,4,neck.shadow);
    p.line(G.cx-10,y+3,G.cx+3,y+9,'#e8e2d6'); p.rect(G.cx+2,y+5+strum,3,3,skin.base); }
  else if (inst==='keys'){ const r=ramp(finishOf(a,'keys'));
    p.rect(G.cx-11,y+7,22,4,r.base); p.rect(G.cx-11,y+7,22,1,'#e8e2d6');
    for (let i=-10;i<11;i+=3) p.rect(G.cx+i,y+7,1,2,r.line);
    p.rect(G.cx-11,y+11,22,1,r.line); p.col(G.cx-9,y+12,6,r.shadow); p.col(G.cx+8,y+12,6,r.shadow);
    p.rect(G.cx-6+strum,y+4,3,3,skin.base); p.rect(G.cx+4-strum,y+4,3,3,skin.base); }
  else if (inst==='drums'){ const sh=ramp(finishOf(a,'drums'));
    p.oval(G.cx,y+11,9,4,sh.base); p.rect(G.cx-9,y+11,18,4,sh.base); p.oval(G.cx,y+15,9,4,sh.shadow);
    p.rect(G.cx-9,y+10,18,1,'#efe7dc');
    const lift=[0,3,0,3][o.frame%4];
    p.line(G.cx-7,y+6-lift,G.cx-2,y+10,'#d8c9a8'); p.line(G.cx+7,y+3+lift,G.cx+2,y+10,'#d8c9a8'); }
  else if (inst==='mic'){ const r=ramp(finishOf(a,'mic'));
    p.col(G.cx+7,y+2,20,r.base); p.rect(G.cx+4,y+20,7,1,r.shadow);
    p.rect(G.cx+2,y-1,5,2,r.base); p.oval(G.cx+1,y-1,2,2,'#cfcad8');
    p.rect(G.cx-1,y+1+strum,3,3,skin.base); }
  else if (inst==='sax'){ const r=ramp(finishOf(a,'sax'));
    p.rect(G.cx+2,y-1,3,8,r.base); p.rect(G.cx+3,y+7,3,6,r.base); p.oval(G.cx+6,y+13,4,3,r.lit);
    p.dot(G.cx+3,y+3,r.line); p.dot(G.cx+3,y+5,r.line); p.rect(G.cx-2,y+2+strum,3,3,skin.base); }
}

function drawCharacter(p,a,o){
  let bob = 0;
  if (o.pose==='walk') bob=[0,-1,0,-1][o.frame%4];
  else if (o.pose==='idle') bob=[0,0,-1,0][o.frame%4];
  else if (o.pose==='cheer') bob=[-1,-3,-1,-3][o.frame%4];
  else if (o.pose==='jump') bob=-6;
  else if (o.pose==='sit') bob=5;
  else if (o.pose==='play') bob=[0,-1,0,-1][o.frame%4];

  const skin=ramp(a.skinTone), dir=o.dir, half = dir==='E'?G.headHalfSide:G.headHalf;
  hairBack(p,a,dir,bob);
  if (o.pose!=='sit') legsOf(p,a,dir,o);
  torsoOf(p,a,dir,bob);
  armsOf(p,a,dir,o,bob);
  p.rect(G.cx-2,G.neckY+bob,4,2,skin.shadow);
  const hy=G.headTop+bob, hw=half*2;
  p.round(G.cx-half-1,hy-1,hw+2,G.headH+2,skin.line,2);
  p.round(G.cx-half,hy,hw,G.headH,skin.base,1);

  gearOf(p,a,dir,bob); instrumentOf(p,a,o,bob);
}

/* Worn gear.
 *
 * Drawn after the hair and the face, because a hat sits on top of a head.
 * Everything here is unlocked by level — the reason to keep playing is that
 * the person walking round the campus visibly changes. */
function gearOf(p, a, dir, dy) {
  const g = a.gear || {};
  const half = dir === 'E' ? G.headHalfSide : G.headHalf;
  const x = G.cx - half, w = half * 2, top = G.headTop + dy;
  const accent = a.outfit.accent;

  if (g.jacket) {
    const r = ramp(g.jacket === 'varsity' ? '#8a1c2e' : g.jacket === 'denim' ? '#3b5a8a' : '#1d1a33');
    const ty = G.torsoY + dy, th = G.torsoH;
    const hw = dir === 'E' ? G.torsoHalfSide : G.torsoHalf;
    p.rect(G.cx - hw - 1, ty, 3, th, r.base);
    p.rect(G.cx + hw - 2, ty, 3, th, r.shadow);
    p.rect(G.cx - hw - 1, ty, hw * 2 + 2, 2, r.lit);
    if (dir !== 'N') { p.rect(G.cx - hw + 1, ty + 2, 2, th - 3, r.base);
      p.rect(G.cx + hw - 3, ty + 2, 2, th - 3, r.base); }
    if (g.jacket === 'varsity' && dir === 'S') p.rect(G.cx - 3, ty + 4, 3, 4, ramp(accent).lit);
  }

  if (!g.hat) return;
  switch (g.hat) {
    case 'cap': { const r = ramp(accent);
      p.rect(x - 1, top - 1, w + 2, 4, r.base); p.rect(x - 1, top - 1, w + 2, 1, r.lit);
      if (dir === 'S') p.rect(x - 2, top + 3, w + 4, 2, r.shadow);
      else if (dir === 'E') p.rect(G.cx, top + 3, half + 4, 2, r.shadow);
      break; }
    case 'beanie': { const r = ramp(a.outfit.primary);
      p.rect(x - 1, top - 2, w + 2, 6, r.base); p.rect(x - 1, top - 2, w + 2, 2, r.lit);
      p.rect(x - 1, top + 4, w + 2, 2, ramp(accent).base);
      p.dot(G.cx, top - 3, ramp(accent).lit); break; }
    case 'bucket': { const r = ramp(accent);
      p.rect(x - 1, top - 1, w + 2, 5, r.base);
      p.rect(x - 3, top + 4, w + 6, 2, r.shadow);
      p.rect(x - 1, top - 1, w + 2, 1, r.lit); break; }
    case 'beret': { const r = ramp('#8a1c2e');
      p.oval(G.cx - 1, top + 1, half + 1, 4, r.base);
      p.rect(G.cx + half - 1, top - 1, 2, 2, r.lit); break; }
    case 'crown': { const r = ramp('#f5d34a');
      p.rect(x, top - 1, w, 3, r.base);
      for (let i = 0; i < 3; i++) p.rect(x + 1 + i * ((w - 2) / 3 | 0), top - 4, 2, 3, r.lit);
      p.dot(G.cx, top - 5, '#ec4899'); break; }
    case 'halo': { const r = ramp('#ffe9a3');
      p.oval(G.cx, top - 6, half - 1, 2, r.lit);
      p.oval(G.cx, top - 6, half - 3, 1, '#fffbe8'); break; }
  }
}

/* Sheets: render each look once, then the world is only drawImage. */
const COLUMN = {}; let TOTAL_COLS = 0;
for (const pose of POSES) { COLUMN[pose] = TOTAL_COLS; TOTAL_COLS += FRAMES[pose]; }
const sheetCache = new Map();

function sheetKey(a, inst) { const g=a.gear||{};
  return JSON.stringify([a.skinTone,a.hair.style,a.hair.color,a.outfit.style,
  a.outfit.primary,a.outfit.secondary,a.outfit.accent,a.outfit.pattern||'',a.shoes.style,a.shoes.primary,
  a.shoes.accent,(a.accessories||[]).slice().sort(),inst,g.hat||'',g.finish||'',g.jacket||'']); }

function getSheet(a, inst='none') {
  const k = sheetKey(a, inst); const hit = sheetCache.get(k); if (hit) return hit;
  const s = surface(TOTAL_COLS*SW, DIRS.length*SH);
  DIRS.forEach((dir,row) => { for (const pose of POSES) { for (let f=0;f<FRAMES[pose];f++){
    s.ctx.save(); s.ctx.translate((COLUMN[pose]+f)*SW, row*SH);
    drawCharacter(s.p, a, {dir, pose, frame:f, instrument:inst}); s.ctx.restore(); } } });
  const sheet = { canvas:s.canvas,
    rect:(pose,dir,frame)=>[(COLUMN[pose]+(frame%FRAMES[pose]))*SW, DIRS.indexOf(dir)*SH, SW, SH] };
  sheetCache.set(k, sheet); return sheet;
}

function drawSprite(ctx, a, o) {
  const sheet = getSheet(a, o.instrument||'none');
  const flip = o.dir==='W', dir = flip ? 'E' : o.dir;
  const [sx,sy,sw,sh] = sheet.rect(o.pose, dir, o.frame);
  const k = o.scale||1, w=sw*k, h=sh*k;
  const dx = Math.round(o.x - w/2), dy = Math.round(o.y - FOOT*k);
  if (flip) { ctx.save(); ctx.translate(dx+w, dy); ctx.scale(-1,1);
    ctx.drawImage(sheet.canvas, sx,sy,sw,sh, 0,0,w,h); ctx.restore(); }
  else ctx.drawImage(sheet.canvas, sx,sy,sw,sh, dx,dy,w,h);
}

/* A head-and-shoulders crop of the same sheet — the HUD face is provably
   the same person walking around outside. */
function portrait(a, size) {
  const sheet = getSheet(a,'none'); const [sx,sy] = sheet.rect('idle','S',0);
  const CW=20, CH=20, k=size/CW;
  const c = document.createElement('canvas');
  c.width = Math.round(CW*k); c.height = Math.round(CH*k);
  const ctx = c.getContext('2d'); ctx.imageSmoothingEnabled = false;
  ctx.drawImage(sheet.canvas, sx+6, sy+1, CW, CH, 0, 0, c.width, c.height);
  c.style.imageRendering = 'pixelated'; c.style.display = 'block';
  return c;
}
